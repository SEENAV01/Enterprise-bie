name: BIE Math Evidence Producer

on:
  workflow_dispatch:
  push:
    branches: [product/math-evidence-producer-001]
  pull_request:
    branches: [main]
    paths:
      - 'bie/productization/**'
      - 'bie/infrastructure/execution_graph*.py'
      - 'apps/operator/*producer.py'
      - 'apps/operator/*worker_child.py'
      - 'scripts/smoke_bie_math_evidence.py'
      - 'scripts/task031_graph_amendment.py'
      - 'scripts/audit_canonical.py'
      - 'manifests/task031_graph_migration.json'
      - 'tests/productization/math/**'
      - 'tools/run_task031_tests.py'
      - '.github/workflows/math-evidence-producer.yml'

permissions:
  contents: read

concurrency:
  group: bie-math-producer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install unchanged approved API DI profiles
        run: |
          python -m pip install -e '.[document-intelligence,document-intelligence-layout,api,api-test]'
          python -m pip install -r requirements-qa-section16-validation.txt
          python -m pip check
      - name: Math applicability exact source evidence anti bypass and recovery
        run: python -B tools/run_task031_tests.py --lane new --output "$RUNNER_TEMP/task031-evidence/new.json"
      - name: Legacy producers native Math DI KI PR Reasoning QA and stores
        run: python -B tools/run_task031_tests.py --lane affected --output "$RUNNER_TEMP/task031-evidence/affected.json"
      - name: Unchanged Task029 three stage process
        run: python -B scripts/smoke_bie_di_knowledge.py --output "$RUNNER_TEMP/task031-evidence/task029-process.json"
      - name: Task030 five stage and historical math block
        run: python -B scripts/smoke_bie_pr_reasoning.py --output "$RUNNER_TEMP/task031-evidence/task030-process.json"
      - name: Actual six stage Math no Math unsupported and second process restart
        run: python -B scripts/smoke_bie_math_evidence.py --output "$RUNNER_TEMP/task031-evidence/process.json"
      - name: Full canonical source preservation
        run: python -B scripts/audit_canonical.py --output "$RUNNER_TEMP/task031-evidence/source-preservation.json"
      - name: Preserve safe receipts only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bie-math-evidence-producer-evidence
          path: ${{ runner.temp }}/task031-evidence/*.json
          if-no-files-found: error
          retention-days: 14
