name: BIE DI Knowledge Producer

on:
  workflow_dispatch:
  push:
    branches: [product/di-knowledge-producer-001]
  pull_request:
    branches: [main]
    paths:
      - 'bie/productization/**'
      - 'apps/operator/knowledge*'
      - 'scripts/smoke_bie_di_knowledge.py'
      - 'tests/productization/knowledge/**'
      - 'tools/run_task029_tests.py'
      - '.github/workflows/di-knowledge-producer.yml'

permissions:
  contents: read

concurrency:
  group: bie-di-knowledge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install unchanged approved API DI profiles
        run: |
          python -m pip install -e '.[document-intelligence,document-intelligence-layout,api,api-test]'
          python -m pip check
      - name: Source grounded contracts and fenced recovery
        run: python -B tools/run_task029_tests.py --lane new --output "$RUNNER_TEMP/task029-evidence/new.json"
      - name: Inherited API DI KI infrastructure and operator preservation
        run: python -B tools/run_task029_tests.py --lane affected --output "$RUNNER_TEMP/task029-evidence/affected.json"
      - name: Actual native PDF real child process and durable reopen
        run: python -B scripts/smoke_bie_di_knowledge.py --output "$RUNNER_TEMP/task029-evidence/process.json"
      - name: Safe receipts only no private CAS or source
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bie-di-knowledge-producer-evidence
          path: ${{ runner.temp }}/task029-evidence/*.json
          if-no-files-found: error
          retention-days: 14
