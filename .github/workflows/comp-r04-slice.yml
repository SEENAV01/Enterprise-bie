name: COMP R04 - one checked fixture (not acceptance)

on:
  # A review-branch execution does not require merging a workflow into main.
  push:
    branches: ['validation/comp-r04-20260920']
    paths: ['tools/comp-r04/**', '.github/workflows/comp-r04-slice.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: comp-r04-slice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  technical-fixture:
    if: github.repository == 'SEENAV01/Enterprise-bie' && github.ref == 'refs/heads/validation/comp-r04-20260920'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      # Driver and tested source are separate: never test a moving main checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 16d4d87824e77db3565a231a332e7977d39d7117
          path: canonical
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Reuse the successful canonical hosted-worker setup, unchanged
        working-directory: canonical
        run: |
          set -euo pipefail
          cmp requirements-comp-h3.txt .integration/tools/requirements-validation.txt
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE/canonical" bash .integration/tools/setup_ci_environment.sh
      - name: Record run identity and run helper contract checks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r04-control"
          {
            printf 'driver_sha=%s\nsource_sha=%s\nrun_id=%s\nrun_attempt=%s\n' \
              "$GITHUB_SHA" 16d4d87824e77db3565a231a332e7977d39d7117 "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'image_os=%s\nimage_version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          } > "$RUNNER_TEMP/r04-control/hosted-run.txt"
          python -B -m unittest discover -s driver/tools/comp-r04 -p 'test_validation_driver.py' -v \
            2>&1 | tee "$RUNNER_TEMP/r04-control/helper-checks.txt"
      - name: Restore the exact observed lock and provision Remotion's managed browser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --connect-timeout 20 --max-time 120 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/SEENAV01/Enterprise-bie/actions/artifacts/10599699753/zip" \
            --output "$RUNNER_TEMP/r04-lock-origin.zip"
          python -B driver/tools/comp-r04/provision_managed_browser.py \
            --artifact "$RUNNER_TEMP/r04-lock-origin.zip" --output "$RUNNER_TEMP/r04-browser" --allow-network
      - name: First real checked slice with the unchanged captured dependency lock
        run: |
          set -euo pipefail
          BROWSER="$(cat "$RUNNER_TEMP/r04-browser/evidence/BROWSER_PATH.txt")"
          python -B driver/tools/comp-r04/run_comp_r04_slice.py \
            --repo "$GITHUB_WORKSPACE/canonical" --output "$RUNNER_TEMP/r04-first" \
            --browser "$BROWSER" --allow-network \
            --lockfile "$RUNNER_TEMP/r04-browser/evidence/package-lock.json" \
            --expected-lock-sha256 e445be44573e1cbac454af2987d84f795c43e8bc826be5e86b754ee42073b1c7
      - name: Clean replay using the exact first-run lock, not a re-resolution
        run: |
          set -euo pipefail
          BROWSER="$(cat "$RUNNER_TEMP/r04-browser/evidence/BROWSER_PATH.txt")"
          LOCK="$RUNNER_TEMP/r04-first/evidence/package-lock.json"
          LOCK_SHA="$(sha256sum "$LOCK" | cut -d ' ' -f 1)"
          python -B driver/tools/comp-r04/run_comp_r04_slice.py \
            --repo "$GITHUB_WORKSPACE/canonical" --output "$RUNNER_TEMP/r04-replay" \
            --browser "$BROWSER" --allow-network --lockfile "$LOCK" --expected-lock-sha256 "$LOCK_SHA"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          a=root/'r04-first/evidence'; b=root/'r04-replay/evidence'
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def rows(p): return [s for s in p.read_text().splitlines() if s and not s.startswith('#')]
          one=rows(a/'logs/full-framemd5.stdout.txt'); two=rows(b/'logs/full-framemd5.stdout.txt')
          src1=json.loads((a/'GENERATED_SOURCE_SHA256.json').read_text())
          src2=json.loads((b/'GENERATED_SOURCE_SHA256.json').read_text())
          def source_only(m):
              return {k:v for k,v in m.items() if k.endswith(('.ts','.tsx')) or k in ('package.json','tsconfig.json')}
          receipt={'lock_identical':digest(a/'package-lock.json')==digest(b/'package-lock.json'),
                   'generated_code_identical':source_only(src1)==source_only(src2),
                   'decoded_frames_identical':len(one)==48 and one==two,
                   'comparison_scope':'SAME_HOST_SAME_LOCK_TWO_CLEAN_PROJECTS',
                   'frame_visual_inspection':'NOT_PERFORMED','product_accepted':False,
                   'source_sha':'16d4d87824e77db3565a231a332e7977d39d7117'}
          (root/'r04-control/REPLAY_COMPARISON.json').write_text(json.dumps(receipt,indent=2)+'\n')
          if not all(receipt[k] is True for k in ('lock_identical','generated_code_identical','decoded_frames_identical')):
              raise SystemExit('REPLAY_MISMATCH; retain artifacts and investigate; do not rewrite golden fixtures')
          PY
      - name: Preserve all authentic success/failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: comp-r04-fixture-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r04-control/
            ${{ runner.temp }}/r04-browser/evidence/
            ${{ runner.temp }}/r04-first/evidence/
            ${{ runner.temp }}/r04-replay/evidence/
            ${{ runner.temp }}/bie-ci-setup/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
