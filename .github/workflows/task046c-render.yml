# Task 046 Part C, PR 4: render one video spec (the canvas director's video_specs/<video>.json with its assets) at
# 1920 × 1080, 30 fps, in parallel chunks on several runners, join the chunks into one MP4 (a CI artifact), write the
# ≤ 720p review copy and the cost table, and push the review copy with the report to the blindtest-results branch.
# Runs by hand (workflow_dispatch) on a run folder of blindtest-results, and once on a pull request that changes this
# file or the render tool, on the kit's own two fixtures (~70 s; test inputs, not lesson content) as the pipeline's proof.
# Task 048 (render checks): a text check job measures every sampled frame (tools/text_audit.py: texts under the readable 36 px,
# texts on each other) and the report carries it; with "respec" the run's plans are compiled again with this commit's code first
# (tools/respec_video.py), so a fix in the compilers or the blocks shows without a new director run.
name: BIE Task046c Render

on:
  workflow_dispatch:
    inputs:
      run_folder:
        description: folder on blindtest-results with video_specs/ and assets/ (for example runs/vm-t046c-canvas-brain-canvas); empty = the kit fixtures
        default: ''
      video:
        description: video id (video_specs/<video>.json)
        default: 'v1'
      chunks:
        description: chunks (one runner each)
        default: '8'
      dest:
        description: folder under runs/ on blindtest-results for the review copy and the report
        default: 't046c-render'
      publish:
        description: push the review copy and the report to blindtest-results
        type: boolean
        default: true
      respec:
        description: compile the run's plans again with this commit's code before the render (tools/respec_video.py; needs canvas.json and plans/)
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/task046c-render.yml'
      - 'tools/render_spec.py'
      - 'tools/text_audit.py'
      - 'tools/respec_video.py'
      - 'bie/brain/video/text_audit.py'
      - 'bie/brain/video/preview/audit.mjs'

permissions:
  contents: read

concurrency:
  # one run per destination, so several videos render side by side (29 October 2026: dispatching v0, v1, v8 and v16 within a
  # minute cancelled three of the four); a second dispatch of the same destination still replaces the first
  group: task046c-render-${{ github.ref }}-${{ inputs.dest }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  RUN_FOLDER: ${{ inputs.run_folder || '' }}
  VIDEO: ${{ inputs.video || 'v1' }}
  CHUNKS: ${{ inputs.chunks || '4' }}
  DEST: ${{ inputs.dest || 't046c-render' }}
  PUBLISH: ${{ inputs.publish || 'false' }}
  RESPEC: ${{ inputs.respec || 'false' }}
  BIE_ASSET_CACHE: ${{ github.workspace }}/.bie-asset-cache

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: The spec and its assets (from the run folder on blindtest-results, or the kit fixtures)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/in"
          if [ -n "$RUN_FOLDER" ]; then
            git init -q "$RUNNER_TEMP/branch" && cd "$RUNNER_TEMP/branch"
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git fetch -q --depth=1 origin blindtest-results
            git checkout -q FETCH_HEAD -- "$RUN_FOLDER"
            cp "$RUN_FOLDER/video_specs/$VIDEO.json" "$RUNNER_TEMP/in/video_spec.json"
            if [ -d "$RUN_FOLDER/assets" ]; then cp -R "$RUN_FOLDER/assets" "$RUNNER_TEMP/in/assets"; fi
            cd "$GITHUB_WORKSPACE"
            if [ "$RESPEC" = "true" ]; then
              # the plans compiled again with this commit's code (Task 048); a part today's code refuses is listed in RESPEC.json
              python -B tools/respec_video.py --run "$RUNNER_TEMP/branch/$RUN_FOLDER" --video "$VIDEO" --out "$RUNNER_TEMP/respec"
              if [ ! -f "$RUNNER_TEMP/respec/video_specs/$VIDEO.json" ]; then
                echo "::error title=task046c respec::no part of $VIDEO compiles with this commit's code (see RESPEC.json)"; exit 1
              fi
              cp "$RUNNER_TEMP/respec/video_specs/$VIDEO.json" "$RUNNER_TEMP/in/video_spec.json"
              rm -rf "$RUNNER_TEMP/in/assets" && cp -R "$RUNNER_TEMP/respec/assets" "$RUNNER_TEMP/in/assets"
              cp "$RUNNER_TEMP/respec/RESPEC.json" "$RUNNER_TEMP/in/RESPEC.json"
            fi
          else
            python -B tools/render_spec.py fixture --out "$RUNNER_TEMP/in"
          fi
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, os.getcwd())
          from bie.brain.video import render
          spec = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "in", "video_spec.json"), encoding="utf-8"))
          frames = render.total_frames(spec)   # either spec kind: a show-spec carries seconds, a VideoSpec per-scene frames
          print(f"::notice title=task046c render::{frames} frames, {frames / spec['fps']:.1f} s, {len(spec['scenes'])} scenes, {os.environ['CHUNKS']} chunks")
          PY
      - id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ["CHUNKS"])
          print("matrix=" + json.dumps({"include": [{"chunk": i} for i in range(n)]}))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t046c-input
          path: ${{ runner.temp }}/in
          retention-days: 14

  render:
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Fonts and ffmpeg
        run: |
          source tools/ci_apt_prefetch.sh
          apt_prefetch -qq fonts-noto-core fonts-noto-ui-core ffmpeg
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-ui-core ffmpeg >/dev/null
      - name: Web packages, pinned, as of tools/npm_before.txt, and Chromium
        run: |
          python -B tools/toolbox_setup.py --web "$RUNNER_TEMP/web"
          python -B tools/toolbox_setup.py --print-env "$RUNNER_TEMP/web" >> "$GITHUB_ENV"
          (cd "$RUNNER_TEMP/web" && npx --yes playwright@1.56.0 install chromium >/dev/null)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: t046c-input
          path: ${{ runner.temp }}/in
      - name: Render chunk ${{ matrix.chunk }} (Chromium + ffmpeg, 1920 × 1080, 30 fps)
        run: python -B tools/render_spec.py chunk --spec "$RUNNER_TEMP/in/video_spec.json" --assets "$RUNNER_TEMP/in/assets" --out "$RUNNER_TEMP/out" --chunk "${{ matrix.chunk }}" --chunks "$CHUNKS" --dist "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t046c-part-${{ matrix.chunk }}
          path: |
            ${{ runner.temp }}/out/part-*.mp4
            ${{ runner.temp }}/out/part-*.json
          retention-days: 14

  audit:
    # Task 048 frame checks: the same page the chunks render, every 30th frame measured (texts under 36 px, texts on each other)
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Fonts
        run: |
          source tools/ci_apt_prefetch.sh
          apt_prefetch -qq fonts-noto-core fonts-noto-ui-core
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-ui-core >/dev/null
      - name: Web packages, pinned, as of tools/npm_before.txt, and Chromium
        run: |
          python -B tools/toolbox_setup.py --web "$RUNNER_TEMP/web"
          python -B tools/toolbox_setup.py --print-env "$RUNNER_TEMP/web" >> "$GITHUB_ENV"
          (cd "$RUNNER_TEMP/web" && npx --yes playwright@1.56.0 install chromium >/dev/null)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: t046c-input
          path: ${{ runner.temp }}/in
      - name: Text check (sizes on screen, texts on each other)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit"
          python -B tools/text_audit.py --spec "$RUNNER_TEMP/in/video_spec.json" --assets "$RUNNER_TEMP/in/assets" --dist "$RUNNER_TEMP/dist" \
            --every 30 --out "$RUNNER_TEMP/audit/audit.json" | tee "$RUNNER_TEMP/audit/line.txt"
          echo "::notice title=task046c text check::$(cat "$RUNNER_TEMP/audit/line.txt")"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t046c-audit
          path: |
            ${{ runner.temp }}/audit/audit.json
            ${{ runner.temp }}/audit/audit.frames.jsonl
          retention-days: 14

  finish:
    needs: [prepare, render, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write  # only to push the review copy and the report to the blindtest-results branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: ffmpeg
        run: |
          source tools/ci_apt_prefetch.sh
          apt_prefetch -qq ffmpeg
          sudo apt-get install -y -qq ffmpeg >/dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: t046c-input
          path: ${{ runner.temp }}/out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: t046c-part-*
          path: ${{ runner.temp }}/out
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: t046c-audit
          path: ${{ runner.temp }}/out
      - name: Join the chunks, the 720p review copy, the cost table
        run: |
          python -B tools/render_spec.py join --out "$RUNNER_TEMP/out" --chunks "$CHUNKS" --review 720
          python -B tools/render_spec.py measure --out "$RUNNER_TEMP/out"
          python -B tools/render_spec.py summary --out "$RUNNER_TEMP/out" --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA" --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat "$RUNNER_TEMP/out/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json, os
          s = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "out", "summary.json"), encoding="utf-8")).get("text_check") or {}
          if s:
              level = "warning" if s.get("lasting_small_count") or s.get("lasting_overlap_count") else "notice"
              print(f"::{level} title=task046c text check::{s['lasting_small_count']} texts under {s['floor_px']} px and "
                    f"{s['lasting_overlap_count']} pairs on each other for a second or more ({s['frames_sampled']} frames)")
          PY
          rm -rf "$RUNNER_TEMP/out/assets" "$RUNNER_TEMP/out/parts.txt" "$RUNNER_TEMP/out/video_silent.mp4"
      - name: The text-audit gate (the box rule's last check, Navin 5 November 2026; a failed video is never shown)
        id: gate
        run: |
          python - <<'PY'
          import json, os, time
          out = os.path.join(os.environ["RUNNER_TEMP"], "out")
          path = os.path.join(out, "audit.json")
          record = json.load(open(path, encoding="utf-8")) if os.path.exists(path) else {}
          gate = record.get("gate") or {"passed": False, "problems": ["the text audit wrote no gate (no audit.json, or one from an older BIE)"]}
          gate.update(at=int(time.time()), run_id=os.environ["GITHUB_RUN_ID"], sha=os.environ["GITHUB_SHA"])   # the one button skips a stale one
          json.dump(gate, open(os.path.join(out, "gate.json"), "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          for problem in gate["problems"][:20]:
              print(f"::error title=text-audit gate::{problem}")
          level = "notice" if gate["passed"] else "error"
          print(f"::{level} title=text-audit gate::{'passed' if gate['passed'] else 'FAILED'}: overlaps {gate.get('overlap_seconds')} s in all, "
                f"longest {gate.get('longest_overlap_s')} s, {gate.get('long_overlaps', 0)} over {gate.get('long_s', 2):.0f} s, "
                f"{gate.get('small_plan_texts', 0)} plan texts under 36 px")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"passed={'true' if gate['passed'] else 'false'}\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t046c-video
          path: |
            ${{ runner.temp }}/out/video.mp4
            ${{ runner.temp }}/out/review-720p.mp4
            ${{ runner.temp }}/out/cost.json
            ${{ runner.temp }}/out/join.json
            ${{ runner.temp }}/out/summary.json
            ${{ runner.temp }}/out/REPORT.md
            ${{ runner.temp }}/out/video_spec.json
            ${{ runner.temp }}/out/audit.json
            ${{ runner.temp }}/out/gate.json
            ${{ runner.temp }}/out/RESPEC.json
          retention-days: 30
      - name: Publish the review copy and the report to the blindtest-results branch (never the full MP4)
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ steps.gate.outputs.passed }}
        run: |
          set -euo pipefail
          dest="runs/$DEST"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q "$RUNNER_TEMP/branch" && cd "$RUNNER_TEMP/branch"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Several renders publish at once since PR #108 (one concurrency group per destination): a push rejected with
          # "fetch first" (30 October 2026: 4 of 14 Money renders lost the race) is retried on the branch's new tip, up to 6 times.
          for attempt in 1 2 3 4 5 6; do
            git -c http.extraheader="$auth" fetch -q --depth=1 origin blindtest-results
            git checkout -q -B blindtest-results FETCH_HEAD
            rm -rf "$dest" && mkdir -p "$dest"
            if [ "$GATE" = "true" ]; then
              for f in review-720p.mp4 cost.json join.json summary.json REPORT.md video_spec.json; do cp "$RUNNER_TEMP/out/$f" "$dest/"; done
              if [ -d "$RUNNER_TEMP/out/stills" ]; then cp -r "$RUNNER_TEMP/out/stills" "$dest/"; fi     # one still per scene (Task 046 Part D1)
            else
              # the gate failed: no review copy, no summary (the one button reads GATE_FAILED.json), only the records to fix it from
              cp "$RUNNER_TEMP/out/gate.json" "$dest/GATE_FAILED.json"
              cp "$RUNNER_TEMP/out/video_spec.json" "$dest/"
              if [ -f "$RUNNER_TEMP/out/audit.frames.jsonl" ]; then cp "$RUNNER_TEMP/out/audit.frames.jsonl" "$dest/"; fi   # re-read with --frames
            fi
            for f in audit.json gate.json RESPEC.json; do if [ -f "$RUNNER_TEMP/out/$f" ]; then cp "$RUNNER_TEMP/out/$f" "$dest/"; fi; done     # Task 048 checks
            git add "$dest"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Task046c render ${GITHUB_RUN_ID} from ${GITHUB_SHA}: ${DEST}"
            if git -c http.extraheader="$auth" push -q origin HEAD:blindtest-results; then
              echo "::notice title=task046c render::branch blindtest-results, folder ${dest} (push attempt ${attempt})"
              exit 0
            fi
            echo "push attempt ${attempt} rejected (another render published first); fetching the new tip"
            sleep $((attempt * 7))
          done
          echo "::error title=task046c render::could not publish ${dest} after 6 attempts"
          exit 1
      - name: The run fails when the text-audit gate failed (nothing was shown)
        if: steps.gate.outputs.passed != 'true'
        run: |
          echo "::error title=text-audit gate::the video failed the text-audit gate (see gate.json); no review copy was published"
          exit 1
