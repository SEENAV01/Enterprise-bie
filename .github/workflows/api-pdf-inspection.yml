name: BIE API PDF Inspection

on:
  workflow_dispatch:
  push:
    branches: [product/api-pdf-inspection-001]
    paths:
      - "pyproject.toml"
      - "apps/api/**"
      - "bie/document_intelligence/real_pdf_toc_runtime.py"
      - "bie/document_intelligence/real_pdf_hierarchy_runtime.py"
      - "bie/document_intelligence/real_pdf_structure_runtime.py"
      - "bie/document_intelligence/real_pdf_text_runtime.py"
      - "scripts/run_bie_api.py"
      - "tests/productization/document_intelligence/structural_pdf_fixtures.py"
      - "tests/productization/document_intelligence/test_real_pdf_toc_runtime.py"
      - "tests/productization/api/test_pdf_inspection_api.py"
      - ".github/workflows/api-pdf-inspection.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "apps/api/**"
      - "bie/document_intelligence/real_pdf_toc_runtime.py"
      - "bie/document_intelligence/real_pdf_hierarchy_runtime.py"
      - "bie/document_intelligence/real_pdf_structure_runtime.py"
      - "bie/document_intelligence/real_pdf_text_runtime.py"
      - "scripts/run_bie_api.py"
      - "tests/productization/document_intelligence/structural_pdf_fixtures.py"
      - "tests/productization/document_intelligence/test_real_pdf_toc_runtime.py"
      - "tests/productization/api/test_pdf_inspection_api.py"
      - ".github/workflows/api-pdf-inspection.yml"

permissions:
  contents: read

concurrency:
  group: bie-api-pdf-inspection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.13.5
        # actions/setup-python v6.0.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
          cache: pip

      - name: Install scoped API and Document Intelligence dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[document-intelligence,document-intelligence-layout,api,api-test]"
          python -m pip check

      - name: Record runtime versions
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/api-pdf-inspection-evidence"
          mkdir -p "$evidence"
          python --version > "$evidence/python-version.txt" 2>&1
          python -c "import fastapi; print(fastapi.__version__)" > "$evidence/fastapi-version.txt"
          python -c "import uvicorn; print(uvicorn.__version__)" > "$evidence/uvicorn-version.txt"
          python -c "import pypdf; print(pypdf.__version__)" > "$evidence/pypdf-version.txt"
          python -c "import pdfplumber; print(pdfplumber.__version__)" > "$evidence/pdfplumber-version.txt"

      - name: Run targeted API and Task 016 tests
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/api-pdf-inspection-evidence"
          {
            python tests/productization/document_intelligence/test_real_pdf_toc_runtime.py
            python tests/productization/api/test_pdf_inspection_api.py
          } 2>&1 | tee "$evidence/targeted-tests.log"

      - name: Generate safe API evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/api-pdf-inspection-evidence"
          python -c "import json,sys; from pathlib import Path; sys.path.insert(0, str(Path.cwd() / 'tests' / 'productization' / 'document_intelligence')); from fastapi.testclient import TestClient; from structural_pdf_fixtures import hierarchy_pdf_with_outline; from apps.api.main import app; client=TestClient(app); health=client.get('/healthz'); inspection=client.post('/v1/documents/inspect', content=hierarchy_pdf_with_outline(), headers={'content-type':'application/pdf'}); health.raise_for_status(); inspection.raise_for_status(); Path(r'$evidence/health.json').write_text(json.dumps(health.json(), sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8'); Path(r'$evidence/safe-synthetic-inspection.json').write_text(json.dumps(inspection.json(), sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')"

      - name: Upload API PDF inspection evidence
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bie-api-pdf-inspection-evidence
          path: ${{ runner.temp }}/api-pdf-inspection-evidence
          if-no-files-found: error
          retention-days: 14
