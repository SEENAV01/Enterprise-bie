name: BIE DI Structure Signals

on:
  workflow_dispatch:
  push:
    branches: [product/di-structure-signals-001]
    paths:
      - "pyproject.toml"
      - "bie/document_intelligence/block_provenance.py"
      - "bie/document_intelligence/heading_detection.py"
      - "bie/document_intelligence/layout_segmentation.py"
      - "bie/document_intelligence/multicolumn_layout.py"
      - "bie/document_intelligence/page_mapping.py"
      - "bie/document_intelligence/pdfplumber_structure_adapter.py"
      - "bie/document_intelligence/pdfplumber_text_adapter.py"
      - "bie/document_intelligence/pypdf_adapter.py"
      - "bie/document_intelligence/reading_order.py"
      - "bie/document_intelligence/real_pdf_runtime.py"
      - "bie/document_intelligence/real_pdf_structure_runtime.py"
      - "bie/document_intelligence/real_pdf_text_runtime.py"
      - "bie/document_intelligence/source_anchors.py"
      - "bie/document_intelligence/text_blocks.py"
      - "scripts/inspect_real_pdf_structure.py"
      - "tests/imported/BIE_BI_LAYOUT_005/**"
      - "tests/imported/BIE_BI_LAYOUT_008/**"
      - "tests/imported/BIE_BI_PROV_002/**"
      - "tests/productization/document_intelligence/structural_pdf_fixtures.py"
      - "tests/productization/document_intelligence/test_real_pdf_runtime.py"
      - "tests/productization/document_intelligence/test_real_pdf_text_runtime.py"
      - "tests/productization/document_intelligence/test_real_pdf_structure_runtime.py"
      - ".github/workflows/di-structure-signals.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "bie/document_intelligence/block_provenance.py"
      - "bie/document_intelligence/heading_detection.py"
      - "bie/document_intelligence/layout_segmentation.py"
      - "bie/document_intelligence/multicolumn_layout.py"
      - "bie/document_intelligence/page_mapping.py"
      - "bie/document_intelligence/pdfplumber_structure_adapter.py"
      - "bie/document_intelligence/pdfplumber_text_adapter.py"
      - "bie/document_intelligence/pypdf_adapter.py"
      - "bie/document_intelligence/reading_order.py"
      - "bie/document_intelligence/real_pdf_runtime.py"
      - "bie/document_intelligence/real_pdf_structure_runtime.py"
      - "bie/document_intelligence/real_pdf_text_runtime.py"
      - "bie/document_intelligence/source_anchors.py"
      - "bie/document_intelligence/text_blocks.py"
      - "scripts/inspect_real_pdf_structure.py"
      - "tests/imported/BIE_BI_LAYOUT_005/**"
      - "tests/imported/BIE_BI_LAYOUT_008/**"
      - "tests/imported/BIE_BI_PROV_002/**"
      - "tests/productization/document_intelligence/structural_pdf_fixtures.py"
      - "tests/productization/document_intelligence/test_real_pdf_runtime.py"
      - "tests/productization/document_intelligence/test_real_pdf_text_runtime.py"
      - "tests/productization/document_intelligence/test_real_pdf_structure_runtime.py"
      - ".github/workflows/di-structure-signals.yml"

permissions:
  contents: read

concurrency:
  group: bie-di-structure-signals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.13.5
        # actions/setup-python v6.0.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
          cache: pip

      - name: Install scoped Document Intelligence dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[document-intelligence,document-intelligence-layout]"
          python -m pip check

      - name: Record runtime versions
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/di-structure-signals-evidence"
          mkdir -p "$evidence"
          python --version > "$evidence/python-version.txt" 2>&1
          python -c "import pypdf; print(pypdf.__version__)" > "$evidence/pypdf-version.txt"
          python -c "import pdfplumber; print(pdfplumber.__version__)" > "$evidence/pdfplumber-version.txt"

      - name: Run targeted structure-signal tests
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/di-structure-signals-evidence"
          {
            python tests/imported/BIE_BI_LAYOUT_008/tests/book_intelligence/test_heading_detection.py
            python tests/imported/BIE_BI_LAYOUT_005/tests/book_intelligence/test_multicolumn_layout.py
            python tests/imported/BIE_BI_PROV_002/tests/test_block_provenance.py
            python tests/productization/document_intelligence/test_real_pdf_runtime.py
            python tests/productization/document_intelligence/test_real_pdf_text_runtime.py
            python tests/productization/document_intelligence/test_real_pdf_structure_runtime.py
          } 2>&1 | tee "$evidence/targeted-tests.log"

      - name: Generate safe structural-fixture evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/di-structure-signals-evidence"
          fixture="$RUNNER_TEMP/di-structure-signals-fixture.pdf"
          python -c "import sys; from pathlib import Path; sys.path.insert(0, str(Path.cwd() / 'tests' / 'productization' / 'document_intelligence')); from structural_pdf_fixtures import styled_text_pdf; Path(r'$fixture').write_bytes(styled_text_pdf([[(54, 730, 'Left structural evidence', 16, True), (340, 730, 'Right structural evidence', 12, False)]]))"
          python scripts/inspect_real_pdf_structure.py "$fixture" > "$evidence/safe-structural-inspection.json"
          rm "$fixture"

      - name: Upload DI structure-signal evidence
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bie-di-structure-signals-evidence
          path: ${{ runner.temp }}/di-structure-signals-evidence
          if-no-files-found: error
          retention-days: 14
