name: Apply Sealed Post-DIR Integration

on:
  push:
    branches: [integration/post-dir-catchup-20260919]
    paths: [.integration/post-dir-catchup/BIE_POST_DIR_CANONICAL_TRANSFER.tar.xz]

permissions:
  contents: read

concurrency:
  group: bie-sealed-post-dir-integration
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      bundle_sha256: ${{ steps.verify.outputs.bundle_sha256 }}
      receipt_sha256: ${{ steps.verify.outputs.receipt_sha256 }}
      candidate_commit: ${{ steps.verify.outputs.candidate_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify importer control contracts
        run: python -B .integration/tools/test_transport.py
      - name: Install exact declared validation profile
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bie-ci-setup"
          python -m pip install -r .integration/tools/requirements-validation.txt 2>&1 | tee "$RUNNER_TEMP/bie-ci-setup/python-install.log"
          npm install --global typescript@5.8.3 2>&1 | tee "$RUNNER_TEMP/bie-ci-setup/typescript-install.log"
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg bubblewrap libseccomp2
      - name: Restore exact bytes, apply four phases, and run all gates
        id: verify
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: python -B .integration/tools/ci_import.py --root "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/bie-adoption" --trigger "$TRIGGER_SHA"
      - name: Publish verified Git data for separate write job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bie-verified-post-dir-publish
          path: ${{ runner.temp }}/bie-adoption/publish/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve verification and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bie-post-dir-verification-evidence
          path: |
            ${{ runner.temp }}/bie-adoption/evidence/
            ${{ runner.temp }}/bie-adoption/APPLIED.json
            ${{ runner.temp }}/bie-adoption/restored/RESTORATION_RECEIPT.json
            ${{ runner.temp }}/bie-ci-setup/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

  publish-staging:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bie-verified-post-dir-publish
          path: ${{ runner.temp }}/verified-git-data
      - name: Recheck every phase and publish only to staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_SHA: ${{ github.sha }}
          BUNDLE_SHA: ${{ needs.verify.outputs.bundle_sha256 }}
          RECEIPT_SHA: ${{ needs.verify.outputs.receipt_sha256 }}
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_commit }}
        run: |
          python -B .integration/tools/publish_verified.py --root "$GITHUB_WORKSPACE" --artifact "$RUNNER_TEMP/verified-git-data" --trigger "$TRIGGER_SHA" --bundle-sha "$BUNDLE_SHA" --receipt-sha "$RECEIPT_SHA" --candidate "$CANDIDATE_SHA" --output "$RUNNER_TEMP/remote-publication.json"
      - name: Preserve exact remote readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bie-post-dir-remote-readback
          path: ${{ runner.temp }}/remote-publication.json
          if-no-files-found: warn
          retention-days: 14
