name: BIE Android Job Results

on:
  workflow_dispatch:
  push:
    branches: [product/android-job-results-001]
    paths:
      - 'apps/android/**'
      - 'apps/api/main.py'
      - 'apps/api/job_service.py'
      - 'scripts/run_bie_pdf_worker.py'
      - '.github/workflows/android-job-results.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/api/main.py'
      - 'apps/api/job_service.py'
      - 'scripts/run_bie_pdf_worker.py'
      - '.github/workflows/android-job-results.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '9.6.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
          cache: pip

      - name: Verify required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/platform-tools" ] || \
             [ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ] || \
             [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            test -x "$sdkmanager"
            "$sdkmanager" 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'
          fi
          test -d "$ANDROID_HOME/platform-tools"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Verify Android job results build
        working-directory: apps/android
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/android-job-results-evidence"
          mkdir -p "$evidence"
          java -version 2> "$evidence/jdk-version.txt"
          gradle --version > "$evidence/gradle-version.txt"
          gradle --no-daemon -PbieApiBaseUrl=http://127.0.0.1:8765 \
            lintDebug testDebugUnitTest assembleDebug :app:processReleaseMainManifest \
            2>&1 | tee "$evidence/android-build-test.log"

      - name: Verify manifest policy and APK receipt
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/android-job-results-evidence"
          python apps/android/ci/verify_manifests.py "$evidence"
          apk='apps/android/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$apk"
          sha256sum "$apk" | tee "$apk.sha256"
          cp "$apk.sha256" "$evidence/apk-sha256.txt"

      - name: Verify canonical job success and failure over loopback
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[document-intelligence,document-intelligence-layout,api,api-test]"
          python -m pip check
          python apps/android/ci/verify_job_result_contract.py \
            "$RUNNER_TEMP/android-job-results-evidence"

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bie-android-job-results-debug-apk
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      - name: Upload safe job results evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bie-android-job-results-evidence
          path: |
            ${{ runner.temp }}/android-job-results-evidence/
            apps/android/app/build/reports/
            apps/android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
