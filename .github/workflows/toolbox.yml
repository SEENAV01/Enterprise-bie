name: BIE Task046a Toolbox

# The toolbox lane (Task 046a): its own path filter, so the canonical gates do not slow down. Three jobs:
# core (registry, resolver, sources with fakes, page; standard library only), wrappers (one test per wrapper with
# every toolbox extra, Blender and Manim installed) and demos (the proof clips rendered by BIE code, checked, and
# uploaded with contact sheets and receipts; one demo is rendered again by real Remotion as the bridge proof).
on:
  pull_request:
    branches: [main]
    paths:
      - 'bie/toolbox/**'
      - 'bie/brain/video/**'
      - 'bie/brain/assets.py'
      - 'tests/test_task046a_*'
      - 'tests/toolbox/**'
      - 'tools/toolbox_*.py'
      - 'tools/run_task046a_tests.py'
      - 'tools/npm_before.txt'
      - 'pyproject.toml'
      - '.github/workflows/toolbox.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: bie-toolbox-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Registry, capabilities, resolver, sources (fake network), page
        run: python -B tools/run_task046a_tests.py --lane core --output "$RUNNER_TEMP/toolbox/core.json"
      - name: Surface failure summary as annotations
        if: failure()
        run: python3 -B tools/ci_failure_annotation.py "Toolbox core" "$RUNNER_TEMP/toolbox"

  wrappers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: System libraries and programs (Cairo and Pango for Manim, X and GL for Blender's bpy, ffmpeg, ngspice, GMT)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2-dev libpango1.0-dev pkg-config ffmpeg libxi6 libxkbcommon0 libsm6 libxrender1 \
            libxxf86vm1 libgl1 libegl1 ngspice gmt libgmt-dev gmt-dcw gmt-gshhg-low ghostscript >/dev/null
      - name: Every toolbox extra, pinned (pyproject.toml), and PsychoPy's experiment-design part
        run: |
          python -m pip install --no-deps --ignore-requires-python psychopy==2026.2.4
          python -m pip install -e '.[toolbox-core,toolbox-stats,toolbox-bio,toolbox-chem,toolbox-mesh,toolbox-manim,toolbox-blender,toolbox-electrical,toolbox-mech,toolbox-earth,toolbox-astro,toolbox-aero,toolbox-maps,toolbox-law,toolbox-behaviour,toolbox-language]'
      - name: Asset sources cache (the JPL ephemeris for the astronomy test; never in git)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ github.workspace }}/../bie-asset-cache
          key: bie-asset-cache-wrappers-${{ hashFiles('bie/toolbox/sources.py', 'bie/toolbox/adapters/astro.py') }}
      - name: One test per wrapper, no skips
        env:
          BIE_ASSET_CACHE: ${{ github.workspace }}/../bie-asset-cache
        run: python -B tools/run_task046a_tests.py --lane wrappers --output "$RUNNER_TEMP/toolbox/wrappers.json"
      - name: Surface failure summary as annotations
        if: failure()
        run: python3 -B tools/ci_failure_annotation.py "Toolbox wrappers" "$RUNNER_TEMP/toolbox"

  demos:
    needs: [core]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      BIE_ASSET_CACHE: ${{ github.workspace }}/../bie-asset-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: System libraries and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-ui-core libcairo2-dev libpango1.0-dev pkg-config ffmpeg libxi6 \
            libxkbcommon0 libsm6 libxrender1 libxxf86vm1 libgl1 libegl1 ngspice gmt libgmt-dev gmt-dcw gmt-gshhg-low ghostscript >/dev/null
      - name: Python toolbox extras (PsychoPy without its desktop stack, BIE uses psychopy.data only)
        run: |
          python -m pip install --no-deps --ignore-requires-python psychopy==2026.2.4
          python -m pip install -e '.[toolbox-core,toolbox-stats,toolbox-bio,toolbox-chem,toolbox-mesh,toolbox-manim,toolbox-blender,toolbox-electrical,toolbox-mech,toolbox-earth,toolbox-astro,toolbox-aero,toolbox-maps,toolbox-law,toolbox-behaviour,toolbox-language]'
      - name: Web packages, pinned, as of tools/npm_before.txt
        run: |
          python -B tools/toolbox_setup.py --web "$RUNNER_TEMP/web"
          python -B tools/toolbox_setup.py --print-env "$RUNNER_TEMP/web" >> "$GITHUB_ENV"
          (cd "$RUNNER_TEMP/web" && npx --yes playwright@1.56.0 install chromium >/dev/null)
      - name: Asset sources cache (fetched on demand, never in git)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ github.workspace }}/../bie-asset-cache
          key: bie-asset-cache-batch${{ matrix.batch }}-${{ hashFiles('bie/toolbox/sources.py') }}
      - name: Proof clips (BIE code only), contact sheets and receipts
        run: python -B tools/toolbox_demos.py --batch "${{ matrix.batch }}" --out "$RUNNER_TEMP/demos" --keep-going
      - name: Bridge proof - the same clip rendered by real Remotion
        if: matrix.batch == 1
        run: python -B tools/toolbox_demos.py --bridge bio-cell-sheet-flow --out "$RUNNER_TEMP/demos"
      - name: Toolbox page with the results
        if: always()
        run: |
          python -B tools/toolbox_page.py --results "$RUNNER_TEMP/demos/RESULTS.json" --out "$RUNNER_TEMP/demos/TOOLBOX.md" || true
      - name: Clips, contact sheets, receipts and page
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bie-toolbox-demos-batch-${{ matrix.batch }}
          path: |
            ${{ runner.temp }}/demos/*/demo.mp4
            ${{ runner.temp }}/demos/*/bridge.mp4
            ${{ runner.temp }}/demos/*/contact_sheet.png
            ${{ runner.temp }}/demos/*/bridge_sheet.png
            ${{ runner.temp }}/demos/*/receipt.json
            ${{ runner.temp }}/demos/*/bridge.json
            ${{ runner.temp }}/demos/RESULTS.json
            ${{ runner.temp }}/demos/TOOLBOX.md
          if-no-files-found: error
          retention-days: 30
