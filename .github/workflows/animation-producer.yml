name: BIE Animation Producer

on:
  workflow_dispatch:
  push:
    branches: [product/animation-producer-001]
  pull_request:
    branches: [main]
    paths:
      - 'bie/productization/**'
      - 'apps/operator/*producer.py'
      - 'apps/operator/*worker_child.py'
      - 'scripts/smoke_bie_animation.py'
      - 'tests/productization/animation/**'
      - 'tools/run_task035_tests.py'
      - '.github/workflows/animation-producer.yml'

permissions:
  contents: read

concurrency:
  group: bie-animation-producer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # CI-R1 diagnostics compare unchanged tests with the exact canonical base.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install unchanged approved API DI and Section16 profiles
        run: |
          python -m pip install -e '.[document-intelligence,document-intelligence-layout,api,api-test]'
          python -m pip install -r requirements-qa-section16-validation.txt
          python -m pip check
      - name: Task035 CI-R1 diagnostic safety controls only
        run: python -I -B -m unittest discover -s tests/productization/animation -p test_ci_r1_diagnostics.py -v
      - name: Diagnose unchanged Post-DIR tests without changing provisioning
        # Observation receipt only; the original affected lane below is mandatory.
        # Do not install the hypothesized compiler fix before collecting evidence.
        run: python -I -B tests/productization/animation/diagnose_post_dir.py --output "$RUNNER_TEMP/task035-evidence/ci-r1-diagnostics.json"
      - name: Task035 CI-R2 provisioning receipt safety controls only
        run: python -I -B -m unittest discover -s tests/productization/animation -p test_ci_r2_provisioning.py -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Provision approved H3 source compiler and parser profiles
        # These unchanged text-only tests use host identity and the TS parser,
        # not the isolated equation worker, browser, or render setup.
        run: |
          cmp requirements-comp-h3.txt .integration/tools/requirements-validation.txt
          python -m pip install -r requirements-comp-h3.txt
          npm install --global typescript@5.8.3
          python -m pip install -e '.[document-intelligence,document-intelligence-layout,api,api-test]'
          python -m pip install -r requirements-qa-section16-validation.txt
          python -m pip check
      - name: Require actual post-provision compiler passes on candidate and base
        # Fresh same-interpreter children; completion without six PASS results fails.
        run: python -I -B tests/productization/animation/verify_post_dir_provisioning.py --output "$RUNNER_TEMP/task035-evidence/ci-r2-after.json"
      - name: Governed current Visual Animation synchronization grounding QA and recovery
        run: python -B tools/run_task035_tests.py --lane new --output "$RUNNER_TEMP/task035-evidence/new.json"
      - name: Complete inherited producers native Animation QA and store preservation
        run: python -B tools/run_task035_tests.py --lane affected --output "$RUNNER_TEMP/task035-evidence/affected.json"
      - name: Preserved Task029 three-stage process
        run: python -B scripts/smoke_bie_di_knowledge.py --output "$RUNNER_TEMP/task035-evidence/task029-process.json"
      - name: Preserved Task030 five-stage process and historical Math block
        run: python -B scripts/smoke_bie_pr_reasoning.py --output "$RUNNER_TEMP/task035-evidence/task030-process.json"
      - name: Preserved Task031 Math applicability and six-stage process
        run: python -B scripts/smoke_bie_math_evidence.py --output "$RUNNER_TEMP/task035-evidence/task031-process.json"
      - name: Preserved Task032 seven-stage process and Director compatibility
        run: python -B scripts/smoke_bie_pedagogy.py --output "$RUNNER_TEMP/task035-evidence/task032-process.json"
      - name: Preserved Task033 eight-stage native Director and review boundary
        run: python -B scripts/smoke_bie_director.py --output "$RUNNER_TEMP/task035-evidence/task033-process.json"
      - name: Preserved Task034 nine-stage multiple-domain Visual and restart
        run: python -B scripts/smoke_bie_visual.py --output "$RUNNER_TEMP/task035-evidence/task034-process.json"
      - name: Actual ten-stage multiple-domain Animation planning and second-process restart
        run: python -B scripts/smoke_bie_animation.py --output "$RUNNER_TEMP/task035-evidence/process.json"
      - name: Full canonical source preservation
        run: python -B scripts/audit_canonical.py --output "$RUNNER_TEMP/task035-evidence/source-preservation.json"
      - name: Preserve safe receipts only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bie-animation-producer-evidence
          path: ${{ runner.temp }}/task035-evidence/*.json
          if-no-files-found: error
          retention-days: 14
