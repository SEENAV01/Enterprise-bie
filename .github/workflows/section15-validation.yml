name: Section 15 isolated validation
on:
  push:
    branches: [validation/game-section15-h6]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-section15-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  section:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install isolated test dependencies
        run: |
          set -euo pipefail
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          npm install --global typescript@5.8.3
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import subprocess
          with sync_playwright() as pw:
              binary=Path(pw.chromium.executable_path)
          subprocess.run(['sudo','cp','-a',str(binary.parent),'/opt/bie-game-chromium'],check=True)
          subprocess.run(['sudo','ln','-s','/opt/bie-game-chromium/chrome','/usr/local/bin/chromium'],check=True)
          PY
          # User-approved disposable-runner setup; no global sandbox setting changes.
          sudo tee /etc/apparmor.d/bie-game-validation-chromium >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bie-game-validation /opt/bie-game-chromium/chrome flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bie-game-validation-chromium
          chromium --version
      - name: Full section regression with unchanged browser isolation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/game15-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/game15-evidence/COMMIT.txt"
          cd .validation/game-section15
          # Supervisor switches Chromium to the existing unprivileged worker account.
          sudo env PATH="$PATH" GITHUB_SHA="$GITHUB_SHA" BIE_GAME_EVIDENCE="$RUNNER_TEMP/game15-evidence" PYTHONDONTWRITEBYTECODE=1 \
            "$(command -v python)" -X utf8 -B scripts/verify_h6_linux.py
      - name: Preserve exact evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: game-section15-linux-evidence
          path: ${{ runner.temp }}/game15-evidence/
          retention-days: 14
          if-no-files-found: error
