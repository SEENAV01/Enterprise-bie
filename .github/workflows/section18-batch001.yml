name: Section 18 APP Batch 001
on:
  push:
    branches: [section18/app-batch001]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batch001:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install API test profile
        run: python -m pip install 'fastapi==0.141.1' 'httpx==0.28.1' 'pypdf==6.19.0' 'pdfplumber==0.11.10' 'uvicorn==0.53.0'
      - name: Run Section 18 Batch 001 tests
        run: python -B -m unittest discover -s tests/section18 -t . -p 'test_*.py' -v
      - name: Run existing API productization regression
        run: python -B -m unittest discover -s tests/productization/api -p 'test_*.py' -v
      - name: Build and verify atomic and combined packages
        run: |
          mkdir -p dist
          python -B tools/package_section18_batch001.py | tee dist/PACKAGE_RESULT.txt
      - name: Upload Section 18 Batch 001 delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: section18-batch001-delivery
          path: dist/
          if-no-files-found: error
          retention-days: 14
