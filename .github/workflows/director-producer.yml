name: BIE Director Producer

on:
  workflow_dispatch:
  push:
    branches: [product/director-producer-001]
  pull_request:
    branches: [main]
    paths:
      - 'bie/productization/**'
      - 'apps/operator/*producer.py'
      - 'apps/operator/*worker_child.py'
      - 'scripts/smoke_bie_director.py'
      - 'tests/productization/director/**'
      - 'tools/run_task033_tests.py'
      - '.github/workflows/director-producer.yml'

permissions:
  contents: read

concurrency:
  group: bie-director-producer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install unchanged approved API DI and Section16 profiles
        run: |
          python -m pip install -e '.[document-intelligence,document-intelligence-layout,api,api-test]'
          python -m pip install -r requirements-qa-section16-validation.txt
          python -m pip check
      - name: Governed Director production admission QA review and recovery
        run: python -B tools/run_task033_tests.py --lane new --output "$RUNNER_TEMP/task033-evidence/new.json"
      - name: Complete legacy producer native Director Pedagogy QA and store preservation
        run: python -B tools/run_task033_tests.py --lane affected --output "$RUNNER_TEMP/task033-evidence/affected.json"
      - name: Preserved Task029 three-stage process
        run: python -B scripts/smoke_bie_di_knowledge.py --output "$RUNNER_TEMP/task033-evidence/task029-process.json"
      - name: Preserved Task030 five-stage process and historical Math block
        run: python -B scripts/smoke_bie_pr_reasoning.py --output "$RUNNER_TEMP/task033-evidence/task030-process.json"
      - name: Preserved Task031 Math applicability and six-stage process
        run: python -B scripts/smoke_bie_math_evidence.py --output "$RUNNER_TEMP/task033-evidence/task031-process.json"
      - name: Preserved Task032 seven-stage process and Director compatibility
        run: python -B scripts/smoke_bie_pedagogy.py --output "$RUNNER_TEMP/task033-evidence/task032-process.json"
      - name: Actual eight-stage supported non-Math and unsupported-Math processes and restart
        run: python -B scripts/smoke_bie_director.py --output "$RUNNER_TEMP/task033-evidence/process.json"
      - name: Full canonical source preservation
        run: python -B scripts/audit_canonical.py --output "$RUNNER_TEMP/task033-evidence/source-preservation.json"
      - name: Preserve safe receipts only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bie-director-producer-evidence
          path: ${{ runner.temp }}/task033-evidence/*.json
          if-no-files-found: error
          retention-days: 14
