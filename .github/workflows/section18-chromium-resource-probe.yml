name: BIE Section18 Bounded Chromium Resource Diagnostic

on:
  # Retained authentic experiments; no automatic repeat after green036.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: section18-chromium-resource-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Provision unchanged governed toolchain and kernel worker dependencies
        run: |
          set -euo pipefail
          cmp requirements-comp-h3.txt .integration/tools/requirements-validation.txt
          bash .integration/tools/setup_ci_environment.sh
      - name: Provision unchanged pinned browser after the explicit runtime handoff
        run: |
          set -euo pipefail
          bash .integration/tools/setup_game_ci.sh
          test ! -e /usr/local/lib/bie-section18-chromium
          sudo cp -a /opt/bie-game-chromium /usr/local/lib/bie-section18-chromium
          cmp /opt/bie-game-chromium/chrome /usr/local/lib/bie-section18-chromium/chrome
      - name: Real cgroup OOM and Chromium-only virtual-reservation diagnostic
        run: |
          set -euo pipefail
          node tools/test_section18_chromium_probe_transport.cjs
          sudo -n /opt/pyvenv/bin/python -B tools/diagnose_section18_chromium_resource_policy.py --output "$RUNNER_TEMP/chromium-resource-evidence"
      - name: Retain authentic diagnostic including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: section18-chromium-resource-diagnostic
          path: |
            ${{ runner.temp }}/chromium-resource-evidence
            ${{ runner.temp }}/bie-ci-setup
          if-no-files-found: error
          retention-days: 14

  production-boundary-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Provision unchanged pinned runtime
        run: |
          set -euo pipefail
          cmp requirements-comp-h3.txt .integration/tools/requirements-validation.txt
          bash .integration/tools/setup_ci_environment.sh
      - name: Provision unchanged browser and operator dependencies
        run: |
          set -euo pipefail
          bash .integration/tools/setup_game_ci.sh
          test ! -e /usr/local/lib/bie-section18-chromium
          sudo cp -a /opt/bie-game-chromium /usr/local/lib/bie-section18-chromium
          cmp /opt/bie-game-chromium/chrome /usr/local/lib/bie-section18-chromium/chrome
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -e ".[document-intelligence,document-intelligence-layout,api,api-test]"
          python -m pip check
      - name: Prepare canonical synthetic H3 project with existing pins
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/section18-production-boundary-project"
          python -B tools/prepare_section18_native_render.py --destination "$project"
          cd "$project"
          npm install --ignore-scripts --no-audit --no-fund
      - name: Execute resource controls then genuine Wasm bundle and render gates
        run: |
          set -euo pipefail
          sudo -n /opt/pyvenv/bin/python -B tools/validate_section18_chromium_production.py \
            --project "$RUNNER_TEMP/section18-production-boundary-project" \
            --output "$RUNNER_TEMP/section18-production-boundary-evidence"
      - name: Retain authentic production-boundary candidate results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: section18-chromium-production-boundary-evidence
          path: |
            ${{ runner.temp }}/section18-production-boundary-evidence
            ${{ runner.temp }}/bie-ci-setup
          if-no-files-found: error
          retention-days: 14
