name: BIE Task046 Benchmark Render

# Task 046 Part B: the epithelium family segment of v3 rendered through BIE's render path on GitHub-hosted runners (no GPU),
# 1920 × 1080 at 30 fps, in chunks, for route A (procedural three.js world) and route C (the same world from Blender-made glTF
# sheets), with the placeholder voice (eSpeak NG) driving the timing. Each route's chunks are joined, muxed with the narration,
# measured (render seconds per second of video, machine minutes, the list price in rupees), read by the frame checks (the
# 24-rule table with frame numbers), and a ≤ 720p review copy with the report is pushed to the blindtest-results branch under
# runs/t046-v3-benchmark/. A 10-second sample of route A is rendered again by real Remotion (the bridge) and compared.
# Runs by hand (workflow_dispatch) and once when this file changes in a pull request. No AI call, no key.
on:
  workflow_dispatch:
    inputs:
      run_url:
        description: lesson run folder (https) with lesson_plan.json and chapter_map.json; v3 must have passed there
        default: 'https://raw.githubusercontent.com/SEENAV01/Enterprise-bie/blindtest-results/runs/vm-t046-v3-wording-patch-resume-brain-lesson'
      chapter_map_url:
        description: chapter_map.json of the understanding run (the lesson run folder has none)
        default: 'https://raw.githubusercontent.com/SEENAV01/Enterprise-bie/blindtest-results/runs/vm-t045d-tissue-understand-resume3-brain-understand/chapter_map.json'
      videos:
        default: 'v3'
      parts:
        description: script parts to render (comma separated); empty = the whole video
        default: 'c07.1'
      routes:
        description: A, C or A,C
        default: 'A,C'
      chunks:
        description: chunks per route (one runner each)
        default: '8'
      voice:
        description: espeak (placeholder voice drives the timing) or silent (captions on the text estimate)
        default: 'espeak'
      publish:
        description: push the review copy and the report to blindtest-results
        default: 'true'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/task046-benchmark.yml'

permissions:
  contents: read
concurrency:
  group: bie-t046-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  RUN_URL: ${{ inputs.run_url || 'https://raw.githubusercontent.com/SEENAV01/Enterprise-bie/blindtest-results/runs/vm-t046-v3-wording-patch-resume-brain-lesson' }}
  CHAPTER_MAP_URL: ${{ inputs.chapter_map_url || 'https://raw.githubusercontent.com/SEENAV01/Enterprise-bie/blindtest-results/runs/vm-t045d-tissue-understand-resume3-brain-understand/chapter_map.json' }}
  VIDEOS: ${{ inputs.videos || 'v3' }}
  PARTS: ${{ inputs.parts || 'c07.1' }}
  ROUTES: ${{ inputs.routes || 'A,C' }}
  CHUNKS: ${{ inputs.chunks || '8' }}
  VOICE: ${{ inputs.voice || 'espeak' }}
  PUBLISH: ${{ inputs.publish || 'true' }}

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      routes: ${{ steps.matrix.outputs.routes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: eSpeak NG (placeholder voice), ffmpeg, GL libraries for Blender's bpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg libxi6 libxkbcommon0 libsm6 libxrender1 libxxf86vm1 libgl1 libegl1 >/dev/null
      - name: Blender (bpy, pinned) for route C
        if: contains(env.ROUTES, 'C')
        run: python -m pip install -e '.[toolbox-core,toolbox-mesh,toolbox-blender]'
      - name: Shot list by code from the passed script (the director, Part A)
        run: |
          mkdir -p "$RUNNER_TEMP/run"
          curl -sSfL -o "$RUNNER_TEMP/run/lesson_plan.json" "$RUN_URL/lesson_plan.json"
          curl -sSfL -o "$RUNNER_TEMP/run/chapter_map.json" "$CHAPTER_MAP_URL"
          python -B tools/shot_list.py --from-run "$RUNNER_TEMP/run" --videos "$VIDEOS" --out "$RUNNER_TEMP/shots"
          test -f "$RUNNER_TEMP/shots/shots/$VIDEOS.json" || { echo "::error title=Task046 benchmark::$VIDEOS did not pass in $RUN_URL, nothing to render (W-01 or another blocking check)"; exit 1; }
      - name: Route C models (Blender → glTF, one sheet per member the segment shows)
        if: contains(env.ROUTES, 'C')
        run: python -B tools/render_video.py models --plan "$RUNNER_TEMP/shots/shots/$VIDEOS.json" --parts "$PARTS" --out "$RUNNER_TEMP/models"
      - name: Compose the VideoSpec per route (voice, captions, credits)
        run: |
          for route in $(echo "$ROUTES" | tr ',' ' '); do
            extra=""
            if [ "$route" = "C" ]; then extra="--models $RUNNER_TEMP/models"; fi
            python -B tools/render_video.py compose --plan "$RUNNER_TEMP/shots/shots/$VIDEOS.json" --beats "$RUNNER_TEMP/run/lesson_plan.json" \
              --chapter "$RUNNER_TEMP/run/chapter_map.json" --parts "$PARTS" --out "$RUNNER_TEMP/bench/$route" --voice "$VOICE" --route "$route" $extra
          done
          cp -R "$RUNNER_TEMP/shots" "$RUNNER_TEMP/bench/shots"
          if [ -d "$RUNNER_TEMP/models" ]; then cp "$RUNNER_TEMP/models/models.json" "$RUNNER_TEMP/bench/models.json"; fi
      - id: matrix
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          routes = [r for r in os.environ["ROUTES"].split(",") if r]
          n = int(os.environ["CHUNKS"])
          print("matrix=" + json.dumps({"include": [{"route": r, "chunk": i} for r in routes for i in range(n)]}))
          print("routes=" + json.dumps({"route": routes}))
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t046-compose
          path: ${{ runner.temp }}/bench
          retention-days: 14

  render:
    needs: [compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.compose.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Fonts and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-ui-core ffmpeg >/dev/null
      - name: Web packages, pinned, as of tools/npm_before.txt, and Chromium
        run: |
          python -B tools/toolbox_setup.py --web "$RUNNER_TEMP/web"
          python -B tools/toolbox_setup.py --print-env "$RUNNER_TEMP/web" >> "$GITHUB_ENV"
          (cd "$RUNNER_TEMP/web" && npx --yes playwright@1.56.0 install chromium >/dev/null)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: t046-compose
          path: ${{ runner.temp }}/bench
      - name: Render chunk ${{ matrix.chunk }} of route ${{ matrix.route }} (Chromium + SwiftShader + ffmpeg, 1920 × 1080, 30 fps)
        run: python -B tools/render_video.py chunk --spec "$RUNNER_TEMP/bench/${{ matrix.route }}/video_spec.json" --out "$RUNNER_TEMP/bench/${{ matrix.route }}" --chunk "${{ matrix.chunk }}" --chunks "$CHUNKS" --dist "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t046-part-${{ matrix.route }}-${{ matrix.chunk }}
          path: |
            ${{ runner.temp }}/bench/${{ matrix.route }}/part-*.mp4
            ${{ runner.temp }}/bench/${{ matrix.route }}/part-*.json
          retention-days: 14

  bridge:
    # the same spec, its first 10 seconds, rendered by real Remotion: the frames are compared with the preview path's frames
    needs: [compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Fonts and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-ui-core ffmpeg >/dev/null
          python -m pip install pillow==13.0.0
      - name: Web packages, pinned, and Chromium
        run: |
          python -B tools/toolbox_setup.py --web "$RUNNER_TEMP/web"
          python -B tools/toolbox_setup.py --print-env "$RUNNER_TEMP/web" >> "$GITHUB_ENV"
          (cd "$RUNNER_TEMP/web" && npx --yes playwright@1.56.0 install chromium >/dev/null)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: t046-compose
          path: ${{ runner.temp }}/bench
      - name: Real Remotion sample of route A against the preview path
        run: python -B tools/render_video.py bridge --out "$RUNNER_TEMP/bench/A" --frames 300 --dist "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t046-bridge
          path: |
            ${{ runner.temp }}/bench/A/bridge.json
            ${{ runner.temp }}/bench/A/bridge.mp4
            ${{ runner.temp }}/bench/A/bridge_sheet.png
          retention-days: 14

  finish:
    needs: [compose, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compose.outputs.routes) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: ffmpeg and Pillow (the frame checks)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m pip install pillow==13.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: t046-compose
          path: ${{ runner.temp }}/bench
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: t046-part-${{ matrix.route }}-*
          path: ${{ runner.temp }}/bench/${{ matrix.route }}
          merge-multiple: true
      - name: Join the chunks, mux the narration, the 720p review copy, the cost table, the 24-rule table with frame numbers
        run: |
          python -B tools/render_video.py join --out "$RUNNER_TEMP/bench/${{ matrix.route }}" --chunks "$CHUNKS" --review 720
          python -B tools/render_video.py measure --out "$RUNNER_TEMP/bench/${{ matrix.route }}" --route "${{ matrix.route }}"
          python -B tools/render_video.py report --out "$RUNNER_TEMP/bench/${{ matrix.route }}" --route "${{ matrix.route }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t046-result-${{ matrix.route }}
          path: |
            ${{ runner.temp }}/bench/${{ matrix.route }}/review-720p.mp4
            ${{ runner.temp }}/bench/${{ matrix.route }}/report.json
            ${{ runner.temp }}/bench/${{ matrix.route }}/REPORT.md
            ${{ runner.temp }}/bench/${{ matrix.route }}/RULES.md
            ${{ runner.temp }}/bench/${{ matrix.route }}/SHOTS.md
            ${{ runner.temp }}/bench/${{ matrix.route }}/cost.json
            ${{ runner.temp }}/bench/${{ matrix.route }}/compose.json
            ${{ runner.temp }}/bench/${{ matrix.route }}/join.json
            ${{ runner.temp }}/bench/${{ matrix.route }}/plan.json
            ${{ runner.temp }}/bench/${{ matrix.route }}/shots_frames.json
            ${{ runner.temp }}/bench/${{ matrix.route }}/video_spec.json
            ${{ runner.temp }}/bench/${{ matrix.route }}/contact-*.png
          retention-days: 30

  publish:
    needs: [compose, finish, bridge]
    if: always() && needs.finish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write  # only to push the review copies and the report to the blindtest-results branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: t046-result-*
          path: ${{ runner.temp }}/results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: t046-bridge
          path: ${{ runner.temp }}/results/bridge
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: t046-compose
          path: ${{ runner.temp }}/compose
      - name: Summary of both routes
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          for d in "$RUNNER_TEMP"/results/t046-result-*; do route="${d##*-}"; mkdir -p "$RUNNER_TEMP/out/$route"; cp -R "$d/." "$RUNNER_TEMP/out/$route/"; done
          if [ -d "$RUNNER_TEMP/results/bridge" ]; then mkdir -p "$RUNNER_TEMP/out/bridge"; cp -R "$RUNNER_TEMP/results/bridge/." "$RUNNER_TEMP/out/bridge/"; fi
          cp -R "$RUNNER_TEMP/compose/shots" "$RUNNER_TEMP/out/shots"
          if [ -f "$RUNNER_TEMP/compose/models.json" ]; then cp "$RUNNER_TEMP/compose/models.json" "$RUNNER_TEMP/out/models.json"; fi
          python -B tools/render_video.py summary --out "$RUNNER_TEMP/out" --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA" --run-url "$RUN_URL"
          cat "$RUNNER_TEMP/out/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t046-v3-benchmark
          path: ${{ runner.temp }}/out
          retention-days: 30
      - name: Publish to the blindtest-results branch (runs/t046-v3-benchmark)
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest="runs/t046-v3-benchmark"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q "$RUNNER_TEMP/branch" && cd "$RUNNER_TEMP/branch"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="$auth" fetch -q --depth=1 origin blindtest-results
          git checkout -q -b blindtest-results FETCH_HEAD
          rm -rf "$dest" && mkdir -p "$dest" && cp -R "$RUNNER_TEMP/out/." "$dest/"
          git add "$dest"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Task046 benchmark render ${GITHUB_RUN_ID} from ${GITHUB_SHA}"
          git -c http.extraheader="$auth" push -q origin HEAD:blindtest-results
          echo "::notice title=task046 benchmark::branch blindtest-results, folder ${dest}"
