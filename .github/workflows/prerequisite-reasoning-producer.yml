name: BIE Prerequisite Reasoning Producer

on:
  workflow_dispatch:
  push:
    branches: [product/prerequisite-reasoning-producer-001]
  pull_request:
    branches: [main]
    paths:
      - 'bie/productization/**'
      - 'apps/operator/*producer.py'
      - 'apps/operator/*worker_child.py'
      - 'scripts/smoke_bie_pr_reasoning.py'
      - 'tests/productization/reasoning/**'
      - 'tools/run_task030_tests.py'
      - '.github/workflows/prerequisite-reasoning-producer.yml'

permissions:
  contents: read

concurrency:
  group: bie-pr-reasoning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install unchanged approved API DI profiles
        run: |
          python -m pip install -e '.[document-intelligence,document-intelligence-layout,api,api-test]'
          python -m pip check
      - name: Grounded prerequisite reasoning and fenced recovery
        run: python -B tools/run_task030_tests.py --lane new --output "$RUNNER_TEMP/task030-evidence/new.json"
      - name: Task029 Task028 native PR Reasoning infrastructure and operator preservation
        run: python -B tools/run_task030_tests.py --lane affected --output "$RUNNER_TEMP/task030-evidence/affected.json"
      - name: Preserve unchanged three stage actual process profile
        run: python -B scripts/smoke_bie_di_knowledge.py --output "$RUNNER_TEMP/task030-evidence/task029-process.json"
      - name: Actual five stage process restart and Math required BLOCKED control
        run: python -B scripts/smoke_bie_pr_reasoning.py --output "$RUNNER_TEMP/task030-evidence/process.json"
      - name: Preserve safe receipts only including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bie-prerequisite-reasoning-producer-evidence
          path: ${{ runner.temp }}/task030-evidence/*.json
          if-no-files-found: error
          retention-days: 14
