name: Section 15 H6 strict native origin
on:
  push:
    branches: [validation/game-section15-h6-handoff-20260926]
    paths:
      - .github/workflows/section15-h6-native-origin.yml
      - .validation/h6-handoff/verify_native_origin.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: section15-h6-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify unchanged pinned candidate
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin dd75dd9a3070383cb0a8cbfc4d24d1b04cb6aad6
          git diff --exit-code dd75dd9a3070383cb0a8cbfc4d24d1b04cb6aad6 HEAD -- .validation/game-section15 bie app task_registry
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install isolated test dependencies
        run: |
          set -euo pipefail
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          npm install --global typescript@5.8.3
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import subprocess
          with sync_playwright() as pw:
              binary=Path(pw.chromium.executable_path)
          subprocess.run(['sudo','cp','-a',str(binary.parent),'/opt/bie-game-chromium'],check=True)
          subprocess.run(['sudo','ln','-s','/opt/bie-game-chromium/chrome','/usr/local/bin/chromium'],check=True)
          PY
          sudo tee /etc/apparmor.d/bie-game-validation-chromium >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bie-game-validation /opt/bie-game-chromium/chrome flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bie-game-validation-chromium
          chromium --version
      - name: Actual packaged ESM React and audio proof
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h6-native-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/h6-native-evidence/COMMIT.txt"
          git rev-parse HEAD:.validation/game-section15 > "$RUNNER_TEMP/h6-native-evidence/CANDIDATE_TREE.txt"
          sudo env PATH="$PATH" GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" PYTHONDONTWRITEBYTECODE=1 \
            "$(command -v python)" -X utf8 -B .validation/h6-handoff/verify_native_origin.py \
            --source-root "$GITHUB_WORKSPACE/.validation/game-section15" \
            --output "$RUNNER_TEMP/h6-native-evidence/proof"
      - name: Preserve proof and failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: section15-h6-native-origin-evidence
          path: ${{ runner.temp }}/h6-native-evidence/
          retention-days: 14
          if-no-files-found: error
