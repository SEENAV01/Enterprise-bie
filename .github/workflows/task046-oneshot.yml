name: BIE Task046 One-shot Render

# Task 046 one-shot test, Route 1 (26 October 2026): the Blender recipe bie/toolbox/blender/epithelium_studio.py renders
# the 4.5-second simple squamous shot on GitHub-hosted runners (Cycles on the CPU, no GPU), 1920 x 1080 at 30 fps, in
# chunks of frames (one runner each). The frames are joined into a high-quality plate video; the per-frame anchor points
# for BIE's labels, the seconds per frame and the machine minutes go with it to the blindtest-results branch under
# runs/t046-oneshot/route1-plate/ (our renders only). Labels and the caption are drawn by BIE's code on top afterwards
# (VG-02). Runs by hand, or on a push to the pull request whose head commit message contains [render-oneshot]: not on
# every push (a 15-runner render is not a per-commit check). [render-oneshot-finish:<run id>] renders nothing and only
# joins and publishes the frames an earlier run made (its artifacts, kept 14 days). No AI call, no key.
on:
  workflow_dispatch:
    inputs:
      samples:
        description: Cycles samples per pixel (adaptive, with the denoiser)
        default: '32'
      chunks:
        description: chunks of frames (one runner each)
        default: '15'
      publish:
        description: push the plate and the numbers to blindtest-results
        default: 'true'
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - '.github/workflows/task046-oneshot.yml'
      - 'bie/toolbox/blender/epithelium_studio.*'

permissions:
  contents: read
concurrency:
  group: bie-t046-oneshot-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  SAMPLES: ${{ inputs.samples || '32' }}
  CHUNKS: ${{ inputs.chunks || '15' }}
  FRAMES: '135'
  PUBLISH: ${{ inputs.publish || 'true' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.gate.outputs.go }}
      reuse: ${{ steps.gate.outputs.reuse }}
      matrix: ${{ steps.gate.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: gate
        run: |
          go=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || git log -1 --format=%B | grep -qF '[render-oneshot]'; then go=true; fi
          reuse="$(git log -1 --format=%B | sed -n 's/.*\[render-oneshot-finish:\([0-9]\{6,14\}\)\].*/\1/p' | head -1)"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          python3 -c "import json, os; n = int(os.environ['CHUNKS']); print('matrix=' + json.dumps({'chunk': list(range(n))}))" >> "$GITHUB_OUTPUT"
          echo "render: $go (samples $SAMPLES, chunks $CHUNKS)"

  render:
    needs: [gate]
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    steps:
      - name: Start time (machine minutes)
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: GL libraries for Blender's bpy, and bpy (pinned)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxkbcommon0 libsm6 libxrender1 libxxf86vm1 libgl1 libegl1 >/dev/null
          python -m pip install -e '.[toolbox-blender]'
      - name: Render chunk ${{ matrix.chunk }} (Cycles, CPU, 1920 x 1080)
        run: |
          python3 - <<'EOF'
          import json, os
          n, total, c = int(os.environ["CHUNKS"]), int(os.environ["FRAMES"]), int("${{ matrix.chunk }}")
          per = -(-total // n)
          first, last = 1 + c * per, min(total, (c + 1) * per)
          json.dump({"samples": int(os.environ["SAMPLES"]), "frame_from": first, "frame_to": last}, open("params.json", "w"))
          print(first, last)
          EOF
          python -B bie/toolbox/blender/epithelium_studio.py --params params.json --out "$RUNNER_TEMP/plate"
          python3 -c "import json, os, time; p = os.environ['RUNNER_TEMP'] + '/plate/record.json'; r = json.load(open(p)); r['job_seconds'] = round(time.time() - int(os.environ['JOB_START'])); r['chunk'] = int('${{ matrix.chunk }}'); r['cpus'] = os.cpu_count(); json.dump(r, open(p, 'w'), indent=1)"
          mv "$RUNNER_TEMP/plate/record.json" "$RUNNER_TEMP/plate/record-${{ matrix.chunk }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t046-oneshot-chunk-${{ matrix.chunk }}
          path: |
            ${{ runner.temp }}/plate/frames/*.png
            ${{ runner.temp }}/plate/record-*.json
            ${{ runner.temp }}/plate/anchors.json
          retention-days: 14

  sweep:
    # the same frame (70) at other sample counts on the same kind of runner: how far the samples can drop without visible loss
    needs: [gate]
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        spp: [16, 64, 128]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: GL libraries for Blender's bpy, and bpy (pinned)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxkbcommon0 libsm6 libxrender1 libxxf86vm1 libgl1 libegl1 >/dev/null
          python -m pip install -e '.[toolbox-blender]'
      - name: Frame 70 at ${{ matrix.spp }} samples
        run: |
          echo '{"samples": ${{ matrix.spp }}}' > params.json
          python -B bie/toolbox/blender/epithelium_studio.py --params params.json --out "$RUNNER_TEMP/sweep" --stills 70
          mv "$RUNNER_TEMP/sweep/frames/f0070.png" "$RUNNER_TEMP/sweep/sweep-s${{ matrix.spp }}.png"
          mv "$RUNNER_TEMP/sweep/record.json" "$RUNNER_TEMP/sweep/sweep-s${{ matrix.spp }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t046-oneshot-sweep-${{ matrix.spp }}
          path: |
            ${{ runner.temp }}/sweep/sweep-s*.png
            ${{ runner.temp }}/sweep/sweep-s*.json
          retention-days: 14

  finish:
    needs: [gate, render, sweep]
    if: always() && (needs.render.result == 'success' || needs.gate.outputs.reuse != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read   # only to read an earlier run's frames ([render-oneshot-finish:<run id>])
    env:
      FRAMES_RUN: ${{ needs.gate.outputs.reuse || github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: ffmpeg (bounded apt downloads with mirror fail-over, F-11) and Pillow
        run: |
          # run 40329012680: this step's plain apt-get ran into the 30-minute limit on a slow regional mirror
          source tools/ci_apt_prefetch.sh
          sudo timeout 120 apt-get update -qq
          apt_prefetch -qq ffmpeg
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m pip install pillow==13.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: t046-oneshot-chunk-*
          path: ${{ runner.temp }}/plate
          merge-multiple: true
          run-id: ${{ env.FRAMES_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: t046-oneshot-sweep-*
          path: ${{ runner.temp }}/sweep
          merge-multiple: true
          run-id: ${{ env.FRAMES_RUN }}
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: Join the frames into the plate, three stills, the numbers
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out" && mkdir -p "$out"
          test "$(ls "$RUNNER_TEMP"/plate/frames/f*.png | wc -l)" = "$FRAMES"
          ffmpeg -loglevel error -y -framerate 30 -i "$RUNNER_TEMP/plate/frames/f%04d.png" -c:v libx264 -preset slow -crf 12 -pix_fmt yuv420p \
            -movflags +faststart "$out/plate-1080p.mp4"
          ffmpeg -loglevel error -y -i "$out/plate-1080p.mp4" -vf scale=1280:720 -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p \
            -movflags +faststart "$out/plate-720p.mp4"
          cp "$RUNNER_TEMP/plate/anchors.json" "$out/anchors.json"
          python3 - <<'EOF'
          import glob, json, os
          from PIL import Image
          tmp, out = os.environ["RUNNER_TEMP"], os.environ["RUNNER_TEMP"] + "/out"
          for f in (1, 68, 135):
              Image.open(f"{tmp}/plate/frames/f{f:04d}.png").convert("RGB").save(f"{out}/still-f{f:04d}.jpg", quality=92)
          # the sample sweep: frame 70 at each count, the same 640 x 360 crop at full resolution, and its seconds
          sweep = {}
          shots = [(int(os.environ["SAMPLES"]), f"{tmp}/plate/frames/f0070.png")] + [
              (int(p.rsplit("-s", 1)[1][:-4]), p) for p in glob.glob(f"{tmp}/sweep/sweep-s*.png")]
          for spp, path in sorted(shots):
              Image.open(path).convert("RGB").crop((640, 360, 1280, 720)).save(f"{out}/sweep-s{spp}-crop.png")
              rec = f"{tmp}/sweep/sweep-s{spp}.json"
              sweep[spp] = json.load(open(rec))["mean_seconds_per_frame"] if os.path.exists(rec) else None
          rows = sorted((json.load(open(p)) for p in glob.glob(f"{tmp}/plate/record-*.json")), key=lambda r: r["chunk"])
          per_frame = [s for r in rows for s in r["seconds_per_frame"]]
          summary = {"schema": "bie.t046-oneshot-route1/1", "recipe": "epithelium_studio", "member": rows[0]["member"],
                     "samples": rows[0]["samples"], "denoise": rows[0]["denoise"], "resolution": rows[0]["resolution"],
                     "frames": len(per_frame), "chunks": len(rows), "blender": rows[0]["blender"], "cpus_per_runner": rows[0].get("cpus"),
                     "seconds_per_frame_mean": round(sum(per_frame) / len(per_frame), 1),
                     "seconds_per_frame_min": min(per_frame), "seconds_per_frame_max": max(per_frame),
                     "render_machine_minutes": round(sum(per_frame) / 60, 1),
                     "job_machine_minutes": round(sum(r["job_seconds"] for r in rows) / 60, 1),
                     "wall_minutes_longest_chunk": round(max(r["job_seconds"] for r in rows) / 60, 1),
                     "cost_inr": 0, "cost_note": "GitHub-hosted runners on a public repository: no charge",
                     "sweep_seconds_per_frame": {str(k): v for k, v in sweep.items()},
                     "run_id": os.environ.get("GITHUB_RUN_ID"), "frames_run_id": os.environ.get("FRAMES_RUN"),
                     "sha": os.environ.get("GITHUB_SHA"), "chunks_detail": rows}
          json.dump(summary, open(f"{out}/render.json", "w"), indent=1)
          print(json.dumps({k: v for k, v in summary.items() if k != "chunks_detail"}, indent=1))
          EOF
          ls -la "$out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t046-oneshot-route1
          path: ${{ runner.temp }}/out
          retention-days: 30
      - name: Summary
        run: python3 -c "import json, os; d = json.load(open(os.environ['RUNNER_TEMP'] + '/out/render.json')); d.pop('chunks_detail'); print(json.dumps(d, indent=1))" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [finish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # only to push the plate and its numbers to the blindtest-results branch
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: t046-oneshot-route1
          path: ${{ runner.temp }}/out
      - name: Publish to the blindtest-results branch (runs/t046-oneshot/route1-plate)
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest="runs/t046-oneshot/route1-plate"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q "$RUNNER_TEMP/branch" && cd "$RUNNER_TEMP/branch"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="$auth" fetch -q --depth=1 origin blindtest-results
          git checkout -q -b blindtest-results FETCH_HEAD
          rm -rf "$dest" && mkdir -p "$dest" && cp -R "$RUNNER_TEMP/out/." "$dest/"
          git add "$dest"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Task046 one-shot route 1 plate ${GITHUB_RUN_ID} from ${GITHUB_SHA}"
          git -c http.extraheader="$auth" push -q origin HEAD:blindtest-results
          echo "::notice title=task046 one-shot::branch blindtest-results, folder ${dest}"
