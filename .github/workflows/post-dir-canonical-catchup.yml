name: Post-DIR Canonical Catch-up Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: canonical-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ hashFiles('requirements-comp-h3.txt') != '' }}
        with:
          node-version: '22.16.0'
      - name: Install declared compiler test profile when present
        if: ${{ hashFiles('requirements-comp-h3.txt') != '' }}
        run: |
          python -m pip install -r requirements-comp-h3.txt
          npm install --global typescript@5.8.3
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg bubblewrap libseccomp2
      - name: Complete canonical gate
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/canonical-evidence"
          python -B scripts/integrated_check.py --output-dir "$RUNNER_TEMP/canonical-evidence" 2>&1 | tee "$RUNNER_TEMP/canonical-evidence/run.log"
      - name: Exact supplied corpus and adoption verification
        if: ${{ hashFiles('manifests/post_dir_supplied_inputs.json') != '' }}
        run: python -B scripts/verify_post_dir.py --output "$RUNNER_TEMP/canonical-evidence/post-dir-preservation.json"
      - name: Preserve actual results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-regression-evidence
          path: ${{ runner.temp }}/canonical-evidence/
          if-no-files-found: warn
          retention-days: 14
