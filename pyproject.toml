[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-book-intelligence-engine"
version = "0.1.0"
description = "Canonical continuation of the BIE enterprise implementation; not a product release"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
document-intelligence = [
    "pypdf==6.19.0",
]
document-intelligence-layout = [
    "pdfplumber==0.11.10",
]
api = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]
api-test = [
    "httpx==0.28.1",
]
# Task 046a toolbox (bie/toolbox/registry.json): optional groups per subject family, installed only by the toolbox lane
# and on machines that render; versions are the newest with a Python 3.13 Linux wheel before tools/npm_before.txt.
toolbox-core = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "sympy==1.14.0",
    "networkx==3.7",
    "pillow==13.0.0",
]
toolbox-stats = [
    "statsmodels==0.15.0",
]
toolbox-bio = [
    "biopython==1.88",
    "neurokit2==0.2.13",
]
toolbox-chem = [
    "rdkit==2026.9.1",
    "cantera==3.2.0",
]
toolbox-mesh = [
    "trimesh==5.1.1",
]
toolbox-manim = [
    "manim==0.22.0",
]
toolbox-blender = [
    "bpy==5.2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bie*", "app", "app.bie"]
exclude = ["batches*", "historical*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
