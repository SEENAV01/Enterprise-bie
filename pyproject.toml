[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-book-intelligence-engine"
version = "0.1.0"
description = "Canonical continuation of the BIE enterprise implementation; not a product release"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
document-intelligence = [
    "pypdf==6.19.0",
]
document-intelligence-layout = [
    "pdfplumber==0.11.10",
]
api = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]
api-test = [
    "httpx==0.28.1",
]
# Task 046a toolbox (bie/toolbox/registry.json): optional groups per subject family, installed only by the toolbox lane
# and on machines that render; versions are the newest with a Python 3.13 Linux wheel before tools/npm_before.txt.
toolbox-core = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "sympy==1.14.0",
    "networkx==3.7",
    "pillow==13.0.0",
]
toolbox-stats = [
    "statsmodels==0.15.0",
]
toolbox-bio = [
    "biopython==1.88",
    "neurokit2==0.2.13",
]
toolbox-chem = [
    "rdkit==2026.9.1",
    "cantera==3.2.0",
]
toolbox-mesh = [
    "trimesh==5.1.1",
]
toolbox-manim = [
    "manim==0.22.0",
]
toolbox-blender = [
    "bpy==5.2.2",
]
# Task 046 one-shot test: Depth Anything V2 Small (Apache-2.0) through ONNX Runtime (MIT), for 2.5D stills
toolbox-depth = [
    "onnxruntime==1.29.0",
]
# batch 2; ngspice and GMT are programs from apt (see .github/workflows/toolbox.yml), not Python packages
toolbox-electrical = [
    "schemdraw==0.23",
    "lcapy==1.26",
    "control==0.10.2",
]
toolbox-mech = [
    "PyNiteFEA==3.2.0",
    "CoolProp==8.0.0",
    "cadquery==2.8.0",
    "cadquery-ocp==7.9.3.1.1",
    "scikit-fem==12.0.2",
]
toolbox-earth = [
    "obspy==1.5.1",
    "pygmt==0.19.0",
    "pygplates==1.0.0",
]
toolbox-astro = [
    "astropy==8.0.2",
    "skyfield==1.55",
]
toolbox-aero = [
    "aerosandbox==4.2.10",
    "jsbsim==1.3.3",
]
# batch 3. PsychoPy is installed by the toolbox lane with --no-deps (its own pins need Python < 3.13 and a desktop
# stack); BIE uses only psychopy.data, which needs the two small packages in toolbox-behaviour.
toolbox-maps = [
    "shapely==2.2.0",
]
toolbox-law = [
    "pyarrow==26.0.0",
]
toolbox-behaviour = [
    "json-tricks==3.17.3",
    "i18next==0.0.3",
]
toolbox-language = [
    "indic-nlp-library==0.92",
    "indic-transliteration==2.3.82",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bie*", "app", "app.bie"]
exclude = ["batches*", "historical*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
