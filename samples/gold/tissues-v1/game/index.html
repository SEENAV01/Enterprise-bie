<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meristem Mission · Tissues Part 1</title>
<style>
:root{--bg0:#071624;--bg1:#0d2438;--ink:#F4F7FB;--soft:#A9BCD0;--dim:#5F7891;--leaf:#4ADE80;--amber:#FBBF24;--coral:#FB7185;--sky:#38BDF8;--violet:#A78BFA;--red:#F43F5E;--green:#22C55E;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg0));color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
.app{width:100%;max-width:560px;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:10px}
.tag{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--soft)}
.xp{margin-left:auto;font-weight:800;color:var(--amber);font-size:15px}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--sky));transition:width .5s}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.round{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--leaf);text-transform:uppercase}
h1{font-size:26px;line-height:1.2;margin:6px 0 2px}
h2{font-size:21px;line-height:1.3;margin:4px 0 10px}
p{color:var(--soft);line-height:1.5;margin:6px 0}
.btn{appearance:none;border:0;border-radius:16px;padding:15px 16px;font:inherit;font-weight:800;font-size:17px;color:var(--bg0);background:var(--amber);width:100%;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.grid{display:grid;gap:10px}
.two{grid-template-columns:1fr 1fr}
.opt{appearance:none;text-align:left;font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.05);border:1.5px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:all .15s}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--green);background:rgba(34,197,94,.16)}
.opt.bad{border-color:var(--red);background:rgba(244,63,94,.14);animation:shake .35s}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{display:none;border-radius:16px;padding:14px;font-size:15px;line-height:1.5}
.feedback.show{display:block;animation:pop .25s}
.feedback.ok{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.5)}
.feedback.bad{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.5)}
.feedback b{display:block;margin-bottom:4px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.chip{border-radius:999px;padding:10px 14px;font-weight:800;font-size:15px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);cursor:pointer}
.chip.placed{background:rgba(56,189,248,.16);border-color:var(--sky)}
.slot{border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;color:var(--dim);font-weight:700}
.sortcard{font-size:20px;font-weight:800;text-align:center;padding:26px 16px;border-radius:20px;background:rgba(255,255,255,.07);border:1.5px solid var(--line);min-height:96px;display:flex;align-items:center;justify-content:center}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{border-radius:16px;padding:14px 10px;font-weight:900;font-size:17px;border:2px solid;background:transparent;cursor:pointer;font-family:inherit}
.bin.l{color:var(--leaf);border-color:var(--leaf)} .bin.r{color:var(--violet);border-color:var(--violet)}
.count{font-size:13px;color:var(--dim);font-weight:700;text-align:right}
.plant{width:100%;height:auto;display:block;border-radius:18px;background:rgba(0,0,0,.18)}
.zone{cursor:pointer}
.zone circle,.zone rect{transition:all .2s}
.zone:hover circle,.zone:hover rect{opacity:.9}
.stars{font-size:40px;text-align:center;letter-spacing:6px}
.mastery{display:grid;gap:10px}
.m-row{display:grid;grid-template-columns:1fr 64px;gap:8px;align-items:center;font-size:15px;font-weight:700}
.m-bar{height:10px;border-radius:10px;background:rgba(255,255,255,.08);overflow:hidden;grid-column:1/3}
.m-bar>i{display:block;height:100%}
.small{font-size:13px;color:var(--dim)}
.hero{text-align:center;padding:26px 18px}
.hero .emoji{font-size:64px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-200%);background:var(--amber);color:var(--bg0);font-weight:900;padding:10px 18px;border-radius:999px;transition:transform .3s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script>
// Meristem Mission: revision game for "Tissues · Part 1" (gold reference sample, BIE Task 038 follow-up).
// Built from the same lesson as Video 1. Mechanics follow Section 15 types: sequencing, classify_sort,
// map_interaction, branching_scenario (retrieval) and misconception_trap. Facts from the chapter PDF pp. 87, 95.
const ROUNDS = [
  { id: "ladder", concept: "Organisation", kind: "sequence", title: "Seedhi lagao",
    prompt: "Chhote se bade ki taraf sahi kram mein tap karo.",
    items: ["Cell", "Tissue", "Organ", "Organ system", "Organism"],
    why: "Cell → Tissue → Organ → Organ system → Organism. Exam mein yahi kram ulat-pulat karke poocha jata hai." },
  { id: "division", concept: "Cell division", kind: "sort", title: "Mitosis ya Meiosis?",
    bins: ["Mitosis", "Meiosis"],
    cards: [["Somatic (body) cells mein", 0], ["Germ cells mein", 1], ["2 daughter cells", 0], ["4 daughter cells", 1],
            ["Chromosome number same rehta hai", 0], ["Chromosome number aadha", 1], ["Equational division", 0], ["Reduction division", 1],
            ["Isse gametes bante hain", 1], ["Crossing over hota hai", 1]],
    why: { 0: "Mitosis: somatic cells, 1 baar division, 2 diploid cells, chromosome number same (equational).",
           1: "Meiosis: germ cells, 2 baar division, 4 haploid cells, chromosome number aadha (reduction), gametes, crossing over." } },
  { id: "map", concept: "Meristem types", kind: "map", title: "Meristem ko jagah do",
    asks: [["Apical meristem kahan hota hai? (ek jagah tap karo)", "apical", "Apical = apex/tip: shoot tip aur root tip. Inse lambai badhti hai."],
           ["Lateral meristem kahan hota hai?", "lateral", "Lateral = side: bark ke neeche, tane ke chaaron or. Isse girth (motai) badhti hai."],
           ["Intercalary meristem kahan hota hai?", "intercalary", "Leaves ke base ya internodes par. Isse leaves aur internodes ki lambai badhti hai."]] },
  { id: "detective", concept: "Meristem types", kind: "mcq", title: "Growth detective",
    qs: [["Lawn ki ghaas upar se kaati, phir bhi kuch din mein lambi ho gayi. Kaun zimmedar?", ["Apical", "Lateral", "Intercalary"], 2,
          "Ghaas ka growth zone leaf ke base par hai (intercalary). Upar se katne par bhi woh bacha rehta hai."],
         ["Ek ped ka tana 10 saal mein kaafi mota ho gaya. Kaun zimmedar?", ["Apical", "Lateral", "Intercalary"], 1,
          "Girth (motai) lateral meristem badhata hai, jo bark ke neeche hota hai."],
         ["Ek paudhe ki jad mitti mein aur neeche tak pahunch gayi. Kaun zimmedar?", ["Apical", "Lateral", "Intercalary"], 0,
          "Root tip par apical meristem hota hai; wahi root ki lambai badhata hai."]] },
  { id: "cells", concept: "Meristem features", kind: "sort", title: "Meristematic ya Permanent?",
    bins: ["Meristematic", "Permanent"],
    cards: [["Vacuole absent", 0], ["Bada central vacuole", 1], ["Lagatar divide hoti hain", 0], ["Divide hona band, pakka kaam", 1],
            ["Intercellular spaces absent, compactly packed", 0], ["Cell wall thick", 1], ["Growing regions mein (root, shoot)", 0],
            ["Differentiation ke baad bante hain", 1]],
    why: { 0: "Meristematic: growing regions, compactly packed, vacuole absent, sirf cell division.",
           1: "Permanent: divide hona band, differentiation, bada central vacuole, cell wall thick." } },
  { id: "traps", concept: "Exam traps", kind: "tf", title: "UPSC trap: sahi ya galat?",
    qs: [["Plant cells mein mitosis ke dauraan centrioles hote hain.", false, "Galat. Plant cells mein centrioles absent hote hain; asters bhi nahi bante."],
         ["Lateral meristem plant ki lambai badhata hai.", false, "Galat. Lateral girth badhata hai; lambai apical aur intercalary badhate hain."],
         ["Plants mein mitosis mainly meristem mein hota hai.", true, "Sahi. Animals mein mitosis poore body ke tissues mein hota hai, plants mein mainly meristem mein."],
         ["Plant cell ke division ke ant mein beech mein cell plate banti hai.", true, "Sahi. Animal cell furrowing (cleavage) se bant-ti hai."],
         ["Meristematic cells mein bada central vacuole hota hai.", false, "Galat. Bada central vacuole permanent tissue ki pehchaan hai."]] },
];

const S = { round: 0, step: 0, xp: 0, streak: 0, score: {}, total: {} };
const app = document.getElementById("app");
const toast = document.getElementById("toast");
let audio;
function beep(ok) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "sine"; o.frequency.value = ok ? 660 : 180;
    if (ok) o.frequency.setValueAtTime(880, audio.currentTime + 0.08);
    g.gain.setValueAtTime(0.12, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.25);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.26);
  } catch (e) {}
}
function flash(msg) { toast.textContent = msg; toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 1100); }
function mark(concept, ok) {
  S.total[concept] = (S.total[concept] || 0) + 1;
  if (ok) { S.score[concept] = (S.score[concept] || 0) + 1; S.streak++; S.xp += 10 + Math.min(20, (S.streak - 1) * 5); if (S.streak >= 3) flash(`🔥 ${S.streak} sahi lagatar!`); }
  else S.streak = 0;
  beep(ok);
}
const shuffle = (a, seed = 7) => { const r = a.slice(); let s = seed; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const esc = (t) => String(t).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function frame(inner) {
  const pct = Math.round((S.round / ROUNDS.length) * 100);
  app.innerHTML = `<div class="top"><span class="tag">MERISTEM MISSION · TISSUES 1</span><span class="xp">⭐ ${S.xp} XP</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>${inner}`;
}
function feedbackHTML(ok, text) { return `<div class="feedback show ${ok ? "ok" : "bad"}"><b>${ok ? "✓ Sahi!" : "✗ Galat"}</b>${esc(text)}</div>`; }

function start() {
  app.innerHTML = `<div class="card hero"><div class="emoji">🌱</div><h1>Meristem Mission</h1>
    <p>Video 1 ka revision: cells ki team, mitosis vs meiosis, aur plant ka growth engine.</p>
    <p class="small">6 rounds · lagbhag 4 minute · har jawab ke saath explanation</p></div>
    <button class="btn" id="go">Shuru karo ▶</button>`;
  document.getElementById("go").onclick = () => { S.round = 0; next(); };
}

function next() {
  if (S.round >= ROUNDS.length) return finish();
  const r = ROUNDS[S.round];
  S.step = 0;
  ({ sequence: playSequence, sort: playSort, map: playMap, mcq: playMcq, tf: playTf })[r.kind](r);
}
function advance() { S.round++; next(); }
function header(r, extra = "") { return `<div class="round">Round ${S.round + 1} / ${ROUNDS.length} · ${esc(r.concept)}</div><h1>${esc(r.title)}</h1>${extra}`; }

function playSequence(r) {
  const order = [], pool = shuffle(r.items, 11);
  let done = false;
  const draw = (fb = "") => {
    frame(`<div class="card">${header(r, `<p>${esc(r.prompt)}</p>`)}
      <div class="chips" style="margin:12px 0">${order.map((x, i) => `<span class="chip placed">${i + 1}. ${esc(x)}</span>`).join("") || '<span class="slot">yahan kram banega…</span>'}</div>
      <div class="chips">${pool.filter((x) => !order.includes(x)).map((x) => `<button class="chip" data-x="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>
      ${fb}${done ? '<button class="btn" id="nx">Aage ▶</button>' : order.length ? '<button class="btn ghost" id="undo">↺ Dobara</button>' : ""}`);
    app.querySelectorAll(".chip[data-x]").forEach((b) => (b.onclick = () => { order.push(b.dataset.x); if (order.length === r.items.length) check(); else draw(); }));
    const u = document.getElementById("undo"); if (u) u.onclick = () => { order.length = 0; draw(); };
    const n = document.getElementById("nx"); if (n) n.onclick = advance;
  };
  const check = () => { const ok = order.every((x, i) => x === r.items[i]); mark(r.concept, ok); done = true; draw(feedbackHTML(ok, r.why)); };
  draw();
}

function playSort(r) {
  const cards = shuffle(r.cards, 5 + S.round);
  let i = 0, answered = null;
  const draw = () => {
    const [text, bin] = cards[i];
    frame(`<div class="card">${header(r, `<p>Har card ko sahi dabbe mein daalo.</p>`)}<div class="count">${i + 1} / ${cards.length}</div>
      <div class="sortcard">${esc(text)}</div></div>
      <div class="bins"><button class="bin l" data-b="0">${esc(r.bins[0])}</button><button class="bin r" data-b="1">${esc(r.bins[1])}</button></div>
      ${answered !== null ? feedbackHTML(answered === bin, r.why[bin]) + '<button class="btn" id="nx">Aage ▶</button>' : ""}`);
    if (answered === null) app.querySelectorAll(".bin").forEach((b) => (b.onclick = () => { answered = Number(b.dataset.b); mark(r.concept, answered === bin); draw(); }));
    else document.getElementById("nx").onclick = () => { i++; answered = null; if (i >= cards.length) advance(); else draw(); };
  };
  draw();
}

const PLANT = (hl = {}) => `<svg class="plant" viewBox="0 0 360 380" aria-label="Plant">
  <rect x="0" y="0" width="360" height="380" fill="none"/>
  <rect x="40" y="250" width="280" height="6" rx="3" fill="#5B4126"/>
  <path d="M180 250 C176 290 186 320 180 355" stroke="#A16207" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M180 285 q-40 18 -70 40 M180 305 q40 18 70 36" stroke="#A16207" stroke-width="4" fill="none"/>
  <line x1="180" y1="250" x2="180" y2="60" stroke="#16A34A" stroke-width="14" stroke-linecap="round"/>
  ${[190, 140, 95].map((y, i) => `<ellipse cx="180" cy="${y}" rx="11" ry="5" fill="#15803D"/>
    <path transform="translate(186,${y}) scale(${0.8 - i * 0.1})" d="M0,0 C30,-10 60,-40 120,-46 C100,-10 70,20 0,0 Z" fill="#22C55E"/>
    <path transform="translate(174,${y}) scale(${-(0.8 - i * 0.1)},${0.8 - i * 0.1})" d="M0,0 C30,-10 60,-40 120,-46 C100,-10 70,20 0,0 Z" fill="#22C55E"/>`).join("")}
  <path d="M171 64 Q180 36 189 64 Z" fill="#4ADE80"/>
  <g class="zone" data-z="apical"><circle cx="180" cy="52" r="22" fill="#FBBF24" opacity="${hl.apical || 0.25}"/><circle cx="180" cy="355" r="18" fill="#FBBF24" opacity="${hl.apical || 0.25}"/></g>
  <g class="zone" data-z="intercalary"><rect x="166" y="${150}" width="28" height="22" rx="6" fill="#38BDF8" opacity="${hl.intercalary || 0.25}"/><rect x="166" y="${102}" width="28" height="22" rx="6" fill="#38BDF8" opacity="${hl.intercalary || 0.25}"/></g>
  <g class="zone" data-z="lateral"><rect x="158" y="196" width="10" height="50" rx="4" fill="#4ADE80" opacity="${hl.lateral || 0.25}"/><rect x="192" y="196" width="10" height="50" rx="4" fill="#4ADE80" opacity="${hl.lateral || 0.25}"/>
    <text x="214" y="228" fill="#A9BCD0" font-size="12" font-weight="700">bark ke neeche</text></g>
  <text x="206" y="56" fill="#A9BCD0" font-size="12" font-weight="700">shoot tip</text>
  <text x="196" y="372" fill="#A9BCD0" font-size="12" font-weight="700">root tip</text>
  <text x="202" y="${166}" fill="#A9BCD0" font-size="12" font-weight="700">leaf base / internode</text>
</svg>`;

function playMap(r) {
  let i = 0, answered = null;
  const draw = () => {
    const [q, want, why] = r.asks[i];
    const hl = answered === null ? {} : { [want]: 1 };
    frame(`<div class="card">${header(r, `<h2>${esc(q)}</h2>`)}<div class="count">${i + 1} / ${r.asks.length}</div>${PLANT(hl)}
      <p class="small">Paudhe par chamakte hisse par tap karo.</p></div>
      ${answered !== null ? feedbackHTML(answered === want, why) + '<button class="btn" id="nx">Aage ▶</button>' : ""}`);
    if (answered === null) app.querySelectorAll(".zone").forEach((z) => (z.onclick = () => { answered = z.dataset.z; mark(r.concept, answered === want); draw(); }));
    else document.getElementById("nx").onclick = () => { i++; answered = null; if (i >= r.asks.length) advance(); else draw(); };
  };
  draw();
}

function playMcq(r) {
  let i = 0, answered = null;
  const draw = () => {
    const [q, opts, right, why] = r.qs[i];
    frame(`<div class="card">${header(r, `<h2>${esc(q)}</h2>`)}<div class="count">${i + 1} / ${r.qs.length}</div>
      <div class="grid">${opts.map((o, k) => `<button class="opt ${answered === null ? "" : k === right ? "ok" : k === answered ? "bad" : ""}" data-k="${k}" ${answered !== null ? "disabled" : ""}>${esc(o)} meristem</button>`).join("")}</div></div>
      ${answered !== null ? feedbackHTML(answered === right, why) + '<button class="btn" id="nx">Aage ▶</button>' : ""}`);
    if (answered === null) app.querySelectorAll(".opt").forEach((b) => (b.onclick = () => { answered = Number(b.dataset.k); mark(r.concept, answered === right); draw(); }));
    else document.getElementById("nx").onclick = () => { i++; answered = null; if (i >= r.qs.length) advance(); else draw(); };
  };
  draw();
}

function playTf(r) {
  let i = 0, answered = null;
  const draw = () => {
    const [q, truth, why] = r.qs[i];
    frame(`<div class="card">${header(r, `<p class="small">STATEMENT ${i + 1} / ${r.qs.length}</p><h2>“${esc(q)}”</h2>`)}
      <div class="grid two"><button class="opt ${answered === null ? "" : truth ? "ok" : answered ? "bad" : ""}" data-v="1" ${answered !== null ? "disabled" : ""}>✓ Sahi</button>
      <button class="opt ${answered === null ? "" : !truth ? "ok" : !answered ? "bad" : ""}" data-v="0" ${answered !== null ? "disabled" : ""}>✗ Galat</button></div></div>
      ${answered !== null ? feedbackHTML(answered === truth, why) + '<button class="btn" id="nx">Aage ▶</button>' : ""}`);
    if (answered === null) app.querySelectorAll(".opt").forEach((b) => (b.onclick = () => { answered = b.dataset.v === "1"; mark(r.concept, answered === truth); draw(); }));
    else document.getElementById("nx").onclick = () => { i++; answered = null; if (i >= r.qs.length) advance(); else draw(); };
  };
  draw();
}

const REVISE = { "Organisation": "Video 1 · Organisation ki seedhi", "Cell division": "Video 1 · Mitosis vs Meiosis",
  "Meristem types": "Video 1 · Apical, Lateral, Intercalary", "Meristem features": "Video 1 · Root tip zoom", "Exam traps": "Video 1 · UPSC traps" };
function finish() {
  const concepts = Object.keys(S.total);
  const right = concepts.reduce((a, c) => a + (S.score[c] || 0), 0), all = concepts.reduce((a, c) => a + S.total[c], 0);
  const pct = Math.round((100 * right) / Math.max(1, all));
  const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 40 ? 1 : 0;
  const weak = concepts.filter((c) => (S.score[c] || 0) / S.total[c] < 0.75);
  frame(`<div class="card hero"><div class="stars">${"★".repeat(stars)}${"☆".repeat(3 - stars)}</div>
      <h1>${pct}% sahi</h1><p>${right} / ${all} · ⭐ ${S.xp} XP</p></div>
    <div class="card"><div class="round">Concept mastery</div><div class="mastery" style="margin-top:10px">
      ${concepts.map((c) => { const p = Math.round((100 * (S.score[c] || 0)) / S.total[c]); const col = p >= 75 ? "var(--green)" : p >= 50 ? "var(--amber)" : "var(--red)";
        return `<div class="m-row"><span>${esc(c)}</span><span style="text-align:right;color:${col}">${p}%</span><div class="m-bar"><i style="width:${p}%;background:${col}"></i></div></div>`; }).join("")}
    </div></div>
    ${weak.length ? `<div class="card"><div class="round" style="color:var(--amber)">Dobara dekho</div>${weak.map((c) => `<p>▶ ${esc(REVISE[c])}</p>`).join("")}</div>` : `<div class="card"><p>Shandaar! Ab Video 2 (permanent tissue) ke liye taiyar ho.</p></div>`}
    <button class="btn" id="again">Phir se khelo ↺</button>`);
  document.getElementById("again").onclick = () => { Object.assign(S, { round: 0, xp: 0, streak: 0, score: {}, total: {} }); next(); };
}
start();
</script>
</body>
</html>
