[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bie-product"
version = "1.2.0"
description = "BIE canonical M1-M300 book-to-video intelligence engine with OpenAI Agents SDK interface"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "openai-agents>=0.14.0",
  "pypdf>=5.0.0",
  "PyMuPDF>=1.24.0",
  "Pillow>=10.0.0",
  "pytesseract>=0.3.13",
]

[project.scripts]
bie-server = "main:main"

[tool.setuptools]
include-package-data = true
