<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIE film</title>
<style>
:root{--ink:#eef3f1;--gold:#e8c26a;--bg:#0c1416;--tint:#2c6e87}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.film{max-width:1100px;margin:0 auto;padding:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px;font-size:.8rem;letter-spacing:.06em}
.top .mark{color:var(--gold);font-weight:700}.top .sc{color:#a9bcc0;text-align:right}
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:#081014}
.world{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform,opacity}
.world img{width:100%;height:100%;object-fit:cover;display:block}
.world .svg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f7f4ec}
.world .svg svg{width:100%;height:100%}
.svg .lit{filter:drop-shadow(0 0 6px #e8a93a)}
.svg :is(rect,circle,ellipse,path,polygon,polyline,line).lit,.svg .lit :is(rect,circle,ellipse,path,polygon,polyline,line){stroke:#c8492b!important;stroke-width:3!important}
.svg text.lit,.svg .lit text{stroke:none!important;font-weight:700}
/* the diagram's words ride on their own top layer: moving sprites and arrows pass under them, never over them */
.world .svg.tl{background:none;pointer-events:none}
.svg.tl svg *{visibility:hidden}.svg.tl svg :is(text,tspan,textPath){visibility:visible}
.svg.tl svg text{transition:opacity .25s}.svg.tl svg text.cut{opacity:0}
.svg.base svg text{visibility:hidden}
.wsvg,.ssvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.labels{position:absolute;inset:0;pointer-events:none}
.spot{position:absolute;inset:0;pointer-events:none;opacity:0}
.pin{position:absolute;transform:translateY(-50%);background:rgba(8,26,33,.9);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:3px 9px;font-size:clamp(.62rem,1.3vw,.9rem);font-weight:600;white-space:nowrap;animation:inn .5s both}
.pin.new{background:var(--gold);color:#17140a;border-color:var(--gold)}
.pin.old{background:rgba(8,26,33,.72);color:#dfe6e8;border-color:rgba(255,255,255,.22);font-size:clamp(.56rem,1.1vw,.8rem)}
.pin.math{font-size:clamp(.8rem,2.2vw,1.35rem);font-weight:700;background:rgba(8,26,33,.75);border-color:var(--gold);color:var(--gold)}
.dot{fill:none;stroke:var(--gold);stroke-width:.35}.lead{stroke:rgba(255,248,225,.9);stroke-width:.18}
.ar{fill:none;stroke:var(--gold);stroke-width:.7;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.1s ease-out forwards}
.flab{position:absolute;transform:translate(-50%,-130%);background:rgba(8,26,33,.9);border-radius:6px;padding:2px 8px;font-size:clamp(.6rem,1.1vw,.82rem);animation:inn .5s .8s both}
.fx{position:absolute;inset:0;pointer-events:none}
/* F1 (Navin, 22 November 2026): a process is built step by step on one picture; the new step glows, earlier steps stay quiet */
.ar.old{stroke:rgba(232,194,106,.5);stroke-width:.45;animation:none;stroke-dashoffset:0}.ah.old{opacity:.5}.flab.old{opacity:.55}
.step{position:absolute;transform:translate(-50%,-50%);width:clamp(18px,2.6vw,30px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#17140a;font-weight:800;font-size:clamp(.62rem,1.3vw,.95rem);box-shadow:0 0 0 3px rgba(232,185,72,.35),0 0 14px rgba(255,210,120,.7);animation:inn .5s both}
.step.old{background:rgba(8,26,33,.88);color:var(--gold);box-shadow:0 0 0 1px rgba(232,185,72,.7)}
/* F3: amounts counted with beads (5 + 1 = 6, then 3 + 3) */
.beads{position:absolute;transform:translate(-50%,-50%) scale(var(--fit,1));display:flex;align-items:center;gap:.6vw;padding:4px 10px;border-radius:999px;background:rgba(8,26,33,.82);color:#fff;font-weight:700;font-size:clamp(.62rem,1.3vw,.95rem);white-space:nowrap;animation:inn .5s both}
.beads .g{display:flex;align-items:center;gap:3px}.beads .g b{width:clamp(7px,1vw,12px);aspect-ratio:1;border-radius:50%;display:inline-block;box-shadow:inset -1px -2px 3px rgba(0,0,0,.35);animation:inn .35s both}.beads .g span{margin-left:4px;font-weight:600;opacity:.9}
.beads .then{display:flex;align-items:center;gap:.6vw;animation:inn .5s 1.6s both}.beads.old{opacity:.6}
.beads.wrap{white-space:normal;flex-wrap:wrap;justify-content:center;width:94%;border-radius:14px}.beads.wrap .then{flex-wrap:wrap;justify-content:center}
.rain{position:absolute;background:repeating-linear-gradient(105deg,rgba(225,238,255,0) 0 7px,rgba(225,238,255,.5) 7px 8px);background-size:60px 60px;animation:rain .45s linear infinite,inn .8s both}
.rise i{position:absolute;bottom:0;width:2px;height:34%;background:linear-gradient(to top,transparent,#ffd98a);animation:rise 2.6s ease-in infinite;opacity:0}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,190,90,.75) 0,transparent 70%);animation:glow 2.2s ease-in-out infinite,inn .6s both}
@keyframes inn{from{opacity:0}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes rain{to{background-position:-14px 60px}}
@keyframes rise{0%{transform:translateY(40%);opacity:0}25%{opacity:.95}100%{transform:translateY(-110%);opacity:0}}
@keyframes glow{50%{transform:scale(1.3)}}
.spin{position:absolute;aspect-ratio:1;border-radius:50%;border:.25vw dashed rgba(255,226,160,.85);transform:translate(-50%,-50%);animation:inn .6s both}
.spin i{position:absolute;inset:0;border-radius:50%;animation:spin 1.8s linear infinite}.spin i::after{content:'';position:absolute;top:-6%;left:44%;width:12%;height:12%;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px #ffd27a}
@keyframes spin{to{transform:rotate(360deg)}}
/* parts cut from the AI picture (bie/brain/picture_parts.py) and moved by the sentences' acts (Navin, 23 November 2026,
   routeS: "pressure moving rotating khulna band hona jaise nigalna pakdna kisi jagah par chipkana"): each part lies exactly
   where it was in the picture, over a plate where the picture is filled in under it, so it can turn, open, close, slide */
.part{position:absolute;inset:0;pointer-events:none;will-change:transform,opacity}
.part .pb{position:absolute}.part .pb img{width:100%;height:100%;display:block}
.part .sheen{position:absolute;inset:0;overflow:hidden;mix-blend-mode:overlay;-webkit-mask-size:100% 100%;mask-size:100% 100%;opacity:0;transition:opacity .4s}
.part .sheen i{position:absolute;top:0;bottom:0;left:0;width:200%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.45) 0,rgba(255,255,255,.5) 3%,rgba(0,0,0,.45) 6%)}
.part.p-spin .sheen{opacity:1}.part.p-spin .sheen i{animation:roll .45s linear infinite}
/* a wheel that faces the camera turns for real; a rod seen from the side rolls its sheen (Navin, 24 November 2026, on the
   remade 11.6.3b: "photorealistic hisse abhi bhi nahi hilte": the turbine's sheen rolled, its wheel never turned) */
.part.p-wheel .pb{animation:spin 2.2s linear infinite}.part.p-wheel .sheen{opacity:0}
/* a part seen from the side (a turbine runner, a stalk) turns about its upright line: BIE drew its turn as a strip of frames
   (bie/brain/part_spin.py) and the strip runs while it spins; on r2 of 11.6.3b (24 November 2026) the turbine's blades
   had not moved by a pixel */
.part .roll{position:absolute;inset:0;overflow:hidden;opacity:0}.part .pb .roll img{position:absolute;left:0;top:0;height:100%;max-width:none;animation-play-state:paused}
.part.p-roll .roll{opacity:1}.part.p-roll .roll img{animation-play-state:running}.part.p-roll .pb>img,.part.p-roll .sheen{opacity:0}
@keyframes rollframes{to{transform:translateX(-100%)}}
.part.p-glow .pb{filter:brightness(1.3) drop-shadow(0 0 .8vw rgba(255,220,140,.95))}
@keyframes roll{to{transform:translateX(-3%)}}
.rider{position:absolute;width:2.2%;aspect-ratio:1;margin:-1.1% 0 0 -1.1%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#dfe9f1 55%,#8aa3b5);box-shadow:0 0 6px rgba(255,255,255,.8);color:#33475a;font:800 clamp(7px,1vw,12px)/1 system-ui;display:flex;align-items:center;justify-content:center;opacity:0}
.pring{fill:none;stroke:#ff8a5c;stroke-width:.4}
.bond{position:absolute;width:7%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle,rgba(255,246,200,.95) 0,rgba(255,200,90,.6) 35%,transparent 70%);pointer-events:none}
.world.ghost{pointer-events:none}
.mtag{transition:opacity .25s}
.vnote{margin-top:8px;padding:9px 12px;border-radius:9px;background:var(--gold);color:#17140a;font-weight:700;font-size:.92rem}
.band{border-top:1px solid var(--gold);margin-top:8px;padding:10px 4px 4px}
.key{color:var(--gold);font-weight:600;font-size:clamp(.9rem,1.8vw,1.1rem);min-height:1.4em}
.sub{font-size:clamp(.95rem,2vw,1.2rem);line-height:1.5;min-height:3em;margin-top:6px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ctl button{background:#132226;color:var(--ink);border:1px solid #2c4248;border-radius:9px;padding:9px 14px;font-size:.95rem;min-height:42px}
.ctl .play{background:var(--gold);color:#17140a;border-color:var(--gold);font-weight:700}
.bar{flex:1;min-width:120px;height:8px;border-radius:4px;background:#1d3238;cursor:pointer;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold);border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div class="film">
<div class="top"><span class="mark" id="mark">BIE</span><span class="sc" id="sc"></span></div>
<div class="stage" id="stage"><div class="world" id="world"></div><div class="spot" id="spot"></div><svg class="ssvg" id="ssvg" viewBox="0 0 100 56.25" preserveAspectRatio="none"></svg><div class="labels" id="labels"></div></div>
<div class="band"><div class="key" id="key"></div><div class="sub" id="sub"></div></div>
<div class="ctl"><button class="play" id="play">&#9654; Film chalaiye</button><button id="again">&#8634; Shuru se</button><div class="bar" id="bar" role="progressbar" aria-label="Film kitni chal chuki hai"><i id="barfill"></i></div></div>
<div class="vnote" id="vnote" hidden>Awaaz band hai: tablet ki awaaz/volume dekhiye, ya file ko Chrome mein kholiye. Film captions ke saath chal rahi hai.</div>
</div>
<script>/*__VOICE__*/</script>
<script>
'use strict';
// BIE film player (Navin, 18-19 November 2026). One film = shots; each sentence brings what appears while it is spoken.
// Motion layer (Campbell 17 benchmark): moves (things along a path), grows (a living line), fuses (two become one),
// a camera that pushes in up to 2.2x, and shots that dive into a point of the previous picture. All drawn by the browser.
// Living films (Navin, 20 November 2026, after the first Photosynthesis films: "slides jaisa", reactions only written in a box):
// molecule actors from BIE's kit (bie/brain/molecule_kit.json), reacts (inputs fly in, products come out and stay), cycles
// (a wheel of stations, like the Calvin cycle, that takes and gives molecules as it turns), a spin effect, and shots that
// zoom through into the next picture instead of cutting. The voice goes through BIEVoice (data: URI, then Web Audio).
const F=/*__FILM__*/null;const NS='http://www.w3.org/2000/svg';const $=id=>document.getElementById(id);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let si=0,ki=0,playing=false,timer=null,token=0;const KIT=F.kit||{elements:{},molecules:{}};
const COL={gold:['#fff3c4','#e8b948','#7a5a12'],green:['#eaffd8','#7fc45a','#2c5a1c'],blue:['#e2f6ff','#5fb8e6','#17506e'],
  red:['#ffe0d8','#e0614a','#6e2015'],white:['#ffffff','#dfe8ea','#7d8b8f'],purple:['#f3e4ff','#a777e0','#45206e']};
document.documentElement.style.setProperty('--tint',F.tint||'#2c6e87');$('mark').textContent='BIE · '+(F.chapter||'');
// one film, not numbered slides (Navin, 20 November 2026: the shot numbers 1-6 under the film made it read as slides): a single
// progress bar shows how far the film has run; a tap on it jumps to the sentence at that point
const DUR=F.shots.flatMap((s,i)=>s.sentences.map((t,k)=>({i,k,d:+t.dur||3})));const TOTAL=DUR.reduce((a,x)=>a+x.d,0)||1;
function startOf(i,k){let a=0;for(const x of DUR){if(x.i===i&&x.k===k)return a;a+=x.d;}return a;}
function bar(i,k,run){const f=$('barfill'),a=startOf(i,k)/TOTAL*100,d=((DUR.find(x=>x.i===i&&x.k===k)||{}).d||0);
  f.style.transition='none';f.style.width=a+'%';if(run){void f.offsetWidth;f.style.transition='width '+d+'s linear';f.style.width=(a+d/TOTAL*100)+'%';}}
function freezeBar(){const f=$('barfill'),w=f.getBoundingClientRect().width/$('bar').getBoundingClientRect().width*100;f.style.transition='none';f.style.width=w+'%';}
$('bar').onclick=e=>{const r=$('bar').getBoundingClientRect(),at=(e.clientX-r.left)/r.width*TOTAL;let a=0,hit=DUR[0];
  for(const x of DUR){if(a+x.d>at){hit=x;break;}a+=x.d;hit=x;}stop();show(hit.i,hit.k);};
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function sv(t,attrs,parent){const e=document.createElementNS(NS,t);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);

// --- camera: screen = o + (p - o) * s, so the picture always fills the frame ---------------------------------------------
const cam={ox:50,oy:50,s:1,from:null,to:null,t0:0,ms:1600,fade:1};
function camTo(x,y,s,ms){cam.from={ox:cam.ox,oy:cam.oy,s:cam.s};cam.to={ox:x,oy:y,s:s};cam.t0=performance.now();cam.ms=reduced?1:ms;}
function camStep(now){if(cam.to){const t=ease((now-cam.t0)/cam.ms);cam.ox=cam.from.ox+(cam.to.ox-cam.from.ox)*t;cam.oy=cam.from.oy+(cam.to.oy-cam.from.oy)*t;
    cam.s=cam.from.s+(cam.to.s-cam.from.s)*t;if(t>=1)cam.to=null;}
  const w=$('world');w.style.transformOrigin=cam.ox+'% '+cam.oy+'%';w.style.transform='scale('+cam.s.toFixed(4)+')';w.style.opacity=cam.fade;
  spotlight();}
// light in the right place: as the camera closes in on a part, the rest of the picture dims around it (Navin, 23 November
// 2026: "zoom sahi jagah, roshni sahi jagah"; the ATP synthase demo he passed dimmed all but the beta in its close-up).
// The zoom point stays where it is on screen, so the light is centred there.
let spotKey='';
function spotlight(){const k=Math.max(0,Math.min(1,(cam.s-1.15)/.35))*(cam.fade>=.98?1:0),key=k.toFixed(2)+' '+cam.ox.toFixed(1)+' '+cam.oy.toFixed(1);
  if(key===spotKey)return;spotKey=key;const e=$('spot');e.style.opacity=(k*.85).toFixed(3);
  // a light picture (r3's cream, matte look) is dimmed gently, so its background does not turn a muddy grey
  const sh=F.shots[si]||{},dark=sh.light!=null&&sh.light>.55?.24:.62;
  if(k>0)e.style.background='radial-gradient(ellipse 40% 52% at '+cam.ox.toFixed(1)+'% '+cam.oy.toFixed(1)+'%,rgba(4,10,12,0) 55%,rgba(4,10,12,'+dark+') 100%)';}
function toScreen(x,y){return[cam.ox+(x-cam.ox)*cam.s,cam.oy+(y-cam.oy)*cam.s];}   // percent of the frame

// --- world layers -------------------------------------------------------------------------------------------------------
let wsvg=null,fxBox=null,texts=[],lastCut=0;
function worldLayers(){wsvg=sv('svg',{class:'wsvg',viewBox:'0 0 100 56.25',preserveAspectRatio:'none'});$('world').appendChild(wsvg);
  const defs=sv('defs',{},wsvg);Object.keys(COL).forEach(k=>{const g=sv('radialGradient',{id:'g-'+k,cx:'35%',cy:'30%',r:'75%'},defs);
    sv('stop',{offset:'0',['stop-color']:COL[k][0]},g);sv('stop',{offset:'.45',['stop-color']:COL[k][1]},g);sv('stop',{offset:'1',['stop-color']:COL[k][2]},g);});
  Object.keys(KIT.elements).forEach(k=>{const c=KIT.elements[k],g=sv('radialGradient',{id:'e-'+k,cx:'35%',cy:'30%',r:'75%'},defs);
    sv('stop',{offset:'0',['stop-color']:c[0]},g);sv('stop',{offset:'.5',['stop-color']:c[1]},g);sv('stop',{offset:'1',['stop-color']:c[2]},g);});
  const f=sv('filter',{id:'halo',x:'-1',y:'-1',width:'3',height:'3'},defs);sv('feGaussianBlur',{stdDeviation:'.6'},f);
  fxBox=el('div','fx');$('world').appendChild(fxBox);}
// a copy of the diagram that shows only its words, above the sprites; ids move to data-oid so ids stay unique
function textLayer(){const base=$('world').querySelector('.svg.base');if(!base)return;const t=base.cloneNode(true);t.className='svg tl';
  t.querySelectorAll('[id]').forEach(e=>{e.dataset.oid=e.id;e.removeAttribute('id');});$('world').appendChild(t);texts=[...t.querySelectorAll('text')];}
// a word the camera cuts at the frame edge fades out (half a word on screen reads as a mistake); it returns when whole again
function edgeCut(now){if(!texts.length||now-lastCut<120)return;lastCut=now;const S=$('stage').getBoundingClientRect();
  for(const t of texts){const r=t.getBoundingClientRect();if(!r.width)continue;
    t.classList.toggle('cut',r.left<S.left-1||r.right>S.right+1||r.top<S.top-1||r.bottom>S.bottom+1);}}

// --- paths: a smooth curve through the points, walked by arc length -----------------------------------------------------
function spline(points){const P=points.map(p=>[p[0],p[1]*.5625]);if(P.length<3)return P.length===2?sample(t=>[P[0][0]+(P[1][0]-P[0][0])*t,P[0][1]+(P[1][1]-P[0][1])*t]):sample(()=>P[0]);
  const at=t=>{const n=P.length-1,f=Math.min(n-1e-9,t*n),i=Math.floor(f),u=f-i,p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(n,i+2)];
    const c=(a,b,c2,d)=>.5*((2*b)+(-a+c2)*u+(2*a-5*b+4*c2-d)*u*u+(-a+3*b-3*c2+d)*u*u*u);return[c(p0[0],p1[0],p2[0],p3[0]),c(p0[1],p1[1],p2[1],p3[1])];};
  return sample(at);}
function sample(at){const pts=[],len=[0];for(let i=0;i<=80;i++){pts.push(at(i/80));if(i)len.push(len[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));}
  const total=len[80]||1;return{pts,len,total,at:u=>{const d=Math.max(0,Math.min(1,u))*total;let i=1;while(i<80&&len[i]<d)i++;const s=(d-len[i-1])/((len[i]-len[i-1])||1);
    return[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*s,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*s,Math.atan2(pts[i][1]-pts[i-1][1],pts[i][0]-pts[i-1][0])];},
    d:'M'+pts.map(p=>p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' L')};}

// --- sprites -------------------------------------------------------------------------------------------------------------
const SPRITE_SCALE=1.6;   // sprites must read on a phone screen
const MOL_SCALE=2.2;   // one kit unit is about one atom across; a molecule must read on a tablet
function unitPx(){return($('stage').getBoundingClientRect().width||1000)/100;}
function molecule(name,parent){const spec=KIT.molecules[name],E=KIT.elements;const outer=sv('g',{},parent);outer.dataset.mol=name;
  const body=sv('g',{},outer),inner=sv('g',{transform:'scale('+MOL_SCALE+')'},body);let low=0;
  for(const q of spec.parts){const k=q[0];
    if(k==='b')sv('line',{x1:q[1],y1:q[2],x2:q[3],y2:q[4],stroke:'#dfe7ea','stroke-width':.16,'stroke-linecap':'round',opacity:.92},inner);
    else if(k==='a'){sv('circle',{cx:q[2],cy:q[3],r:q[4],fill:'url(#e-'+q[1]+')'},inner);low=Math.max(low,q[3]+q[4]);}
    else if(k==='r'){const pts=[];for(let i=0;i<q[5];i++){const an=(q[6]+i*360/q[5])*Math.PI/180;pts.push((q[2]+q[4]*Math.cos(an)).toFixed(3)+','+(q[3]+q[4]*Math.sin(an)).toFixed(3));}
      sv('polygon',{points:pts.join(' '),fill:'url(#e-'+q[1]+')',stroke:(E[q[1]]||['#fff'])[0],'stroke-width':.08},inner);low=Math.max(low,q[3]+q[4]);}
    else if(k==='g')sv('circle',{cx:q[1],cy:q[2],r:q[3],fill:(E[q[4]]||['#fff'])[0],opacity:.5,filter:'url(#halo)'},inner);
    else if(k==='t')sv('text',{x:q[2],y:q[3]+.2,'text-anchor':'middle','font-size':.62,'font-weight':800,fill:'#1a1206'},inner).textContent=q[1];}
  if(spec.tag){const fs=Math.max(1.2,10.5/unitPx()),w=spec.tag.length*fs*.6+fs*.9,ty=low*MOL_SCALE+fs*1.15,tg=sv('g',{class:'mtag'},outer);
    sv('rect',{x:-w/2,y:ty-fs*.95,width:w,height:fs*1.3,rx:fs*.4,fill:'rgba(8,22,28,.84)',stroke:'rgba(255,255,255,.35)','stroke-width':.08},tg);
    sv('text',{x:0,y:ty,'text-anchor':'middle','font-size':fs,'font-weight':700,fill:'#f6f0de'},tg).textContent=spec.tag;}
  return outer;}
// name tags never pile up (Navin's first living film, 20 November 2026: tags sat on each other under the Calvin cycle):
// a tag that would overlap a label or a more important tag hides until it is clear; the molecule itself stays.
// Importance (data-pri): cycle carriers 3, reacting molecules 2, moving ones 1, molecules flying to or from a station 0.

function declutter(now){if(!wsvg||now-lastTag<120)return;lastTag=now;

function suction(P,T,what,now){squash(P,now,null,.93,1500);pressure(T,now+100);
  if(what){const o=outside(P,T,9),m=[(o[0]+T[0])/2+(o[1]-T[1])*.25,(o[1]+T[1])/2-(o[0]-T[0])*.25];
    addMove({what,points:[o,m,T],count:3,ms:1500,colour:'gold',label:''},now,0);}}
// a grip: the molecule comes to the closing site and stays held there, nudged as the part presses
function holdAt(T,what,now,instant,P){const o=outside(P,T,7);if(!instant)addMove({what,points:[o,T],count:1,ms:900,colour:'gold',label:''},now,0);
  const g=pri(sprite(what,'gold',wsvg),1);g.setAttribute('transform',`translate(${T[0]} ${T[1]*.5625})`);g.style.opacity=0;actors.push({kind:'held',g,T,born:instant?now-1000:now+850});}
// riders go round with a spinning part seen from the side: across the front (x = centre + half width x sin), hidden behind
function addRiders(P,what){if(!what||P.riders.length)return;const label=what==='H+'?'H\u207a':what;
  for(let i=0;i<3;i++){const r=el('div','rider',label);P.el.appendChild(r);const o={el:r,P,phase:i/3*Math.PI*2};P.riders.push(o);riders.push(o);}}
function ridersStep(now){for(const r of riders){const b=r.P.box,a=now/2600*Math.PI*2+r.phase,cx=(b[0]+b[2])/2,hw=(b[2]-b[0])/2*.9,front=Math.cos(a);
  r.el.style.left=(cx+hw*Math.sin(a)).toFixed(2)+'%';r.el.style.top=((b[1]+b[3])/2).toFixed(2)+'%';
  r.el.style.opacity=front>0?Math.min(1,front*3).toFixed(2):0;r.el.style.transform='scale('+(.75+.25*Math.max(0,front)).toFixed(2)+')';}}
// pressure: rings close in on the point where the part presses; a bond: a glow where two parts join
function pressure(T,born){const x=T[0],y=T[1]*.5625,rings=[0,1,2].map(()=>{const c=sv('circle',{cx:x,cy:y,r:7,class:'pring'},wsvg);c.style.opacity=0;return c;});
  actors.push({kind:'press',rings,born});}
function bond(T,born){const b=el('div','bond');b.style.left=T[0]+'%';b.style.top=T[1]+'%';fxBox.appendChild(b);actors.push({kind:'bond',b,born});}
// a jump into the middle of a shot first puts every part where the earlier sentences left it
function partsReplay(k){const s=F.shots[si];for(let j=0;j<k;j++)for(const a of (s.sentences[j]||{}).acts||[])doAct(a,performance.now(),true);}

function tick(now){camStep(now);edgeCut(now);partsStep(now);ridersStep(now);
  for(const ac of actors){const t=now-ac.born;
    if(ac.kind==='move'){ac.items.forEach((g,i)=>{const hide=()=>{g.style.opacity=0;(ac.tails[i]||[]).forEach(c=>c.style.opacity=0);};
        const local=t-i*ac.gap;if(local<0){hide();return;}let u=local/ac.ms,rep=ac.loop;
        if(!rep&&ac.until){if(u<Math.max(1,Math.ceil((ac.until-ac.born-i*ac.gap)/ac.ms)))rep=true;else{hide();return;}}
        if(rep)u=u%1;else if(u>1){g.style.opacity=u>1.15?0:1-(u-1)/.15;u=1;}
        const p=ac.path.at(ease(u)*.98+u*.02);const wob=Math.sin(now/180+i)*.25;if(ac.mol){g.setAttribute('transform',`translate(${p[0].toFixed(2)} ${(p[1]+wob*.4).toFixed(2)})`);g.firstChild.setAttribute('transform',`rotate(${(Math.sin(now/420+i)*9).toFixed(1)})`);}
        else g.setAttribute('transform',`translate(${p[0].toFixed(2)} ${(p[1]+wob*.4).toFixed(2)}) rotate(${ac.rot?(p[2]*57.3).toFixed(1):((now/30+i*40)%360).toFixed(0)})`);
        if(u<1||rep)g.style.opacity=Math.min(1,u*8,(1-u)*8+(rep?0:1));if(ac.dim)g.style.opacity=(parseFloat(g.style.opacity)||0)*.3;
        const seen=parseFloat(g.style.opacity)||0;(ac.tails[i]||[]).forEach((c,j)=>{const v=u-TAIL[j];if(v<0||v>=1||u>=1&&!rep){c.style.opacity=0;return;}
          const q=ac.path.at(ease(v)*.98+v*.02);c.setAttribute('cx',q[0].toFixed(2));c.setAttribute('cy',(q[1]+wob*.4).toFixed(2));c.style.opacity=(seen*(.45-j*.13)).toFixed(3);});});}
    else if(ac.kind==='grow'){const u=Math.min(1,t/ac.ms),off=ac.path.total*(1-ease(u));ac.tube.style.strokeDashoffset=off;ac.core.style.strokeDashoffset=off;
      const p=ac.path.at(ease(u));ac.tip.setAttribute('transform',`translate(${p[0].toFixed(2)} ${p[1].toFixed(2)}) scale(${(1+.25*Math.sin(now/160)).toFixed(2)})`);ac.tip.style.opacity=u<1?1:.6;}
    else if(ac.kind==='fuse'){const u=Math.min(1,t/1000),d=6*(1-ease(u));ac.a.setAttribute('transform',`translate(${ac.x-d} ${ac.y})`);ac.b.setAttribute('transform',`translate(${ac.x+d} ${ac.y})`);
      const v=Math.max(0,(t-1000)/900);ac.a.style.opacity=ac.b.style.opacity=u<1?1:0;ac.made.style.opacity=u<1?0:1;ac.made.setAttribute('transform',`translate(${ac.x} ${ac.y}) scale(${(1.25+.08*Math.sin(now/240)).toFixed(2)})`);
      ac.ring.setAttribute('r',(.5+v*6).toFixed(2));ac.ring.setAttribute('opacity',v>0&&v<1?(1-v).toFixed(2):0);}
    else if(ac.kind==='react')stepReact(ac,t,now);
    else if(ac.kind==='cycle')stepCycle(ac,t,now);
    else if(ac.kind==='act'){if(!ac.done&&t>=0){ac.done=true;doAct(ac.a,now);}}
    else if(ac.kind==='held'){ac.g.style.opacity=t<0?0:1;if(t>=0)ac.g.setAttribute('transform',`translate(${ac.T[0]} ${(ac.T[1]*.5625+Math.sin(now/260)*.12).toFixed(3)})`);}
    else if(ac.kind==='press')ac.rings.forEach((c,i)=>{const u=(t-i*230)/900;if(u<0||u>1){c.style.opacity=0;return;}
      c.setAttribute('r',(1.2+5.8*(1-ease(u))).toFixed(2));c.style.opacity=(Math.sin(Math.PI*u)*.95).toFixed(2);});
    else if(ac.kind==='bond'){const u=t/1400;if(u<0){ac.b.style.opacity=0;}else{const v=Math.min(1,u);
      ac.b.style.transform=`translate(-50%,-50%) scale(${(.2+1.1*ease(Math.min(1,u*2))).toFixed(2)})`;ac.b.style.opacity=(u<.5?1:Math.max(.25,1-(u-.5)*1.5)).toFixed(2);}}}
  placeLabels();declutter(now);requestAnimationFrame(tick);}
requestAnimationFrame(tick);

// --- labels live in screen space so they stay readable at any zoom; their anchors follow the camera ------------------------
let labels=[],labelRound=0;
// one name, one label: the same name close by is the same label (a pin and a wheel's station both saying 'Carboxylation'),
// and the same name said again in a later sentence moves the label there (the first Calvin heading film, 23 November 2026)
function addLabel(text,x,y,cls,showAt){const same=labels.find(l=>l.text===text&&Math.hypot(l.x-x,l.y-y)<12);if(same){labels.forEach(l=>l.box.classList.remove('new'));same.box.classList.remove('old');same.box.classList.add('new');same.k=labelRound;return;}
  labels.filter(l=>l.text===text&&l.k!==labelRound).forEach(l=>{l.box.remove();l.dot.remove();l.lead.remove();});labels=labels.filter(l=>l.box.isConnected);
  const b=el('div',cls,text);b.style.opacity=0;$('labels').appendChild(b);
  const dot=sv('ellipse',{class:'dot',rx:1.6,ry:1.6},$('ssvg')),lead=sv('line',{class:'lead'},$('ssvg'));dot.style.opacity=lead.style.opacity=0;
  labels.forEach(l=>l.box.classList.remove('new'));labels.push({box:b,dot,lead,x,y,text,showAt:showAt||0,math:/math/.test(cls),k:labelRound});
  for(const l of labels.filter(l=>!l.math&&l.k<labelRound)){if(labels.length<=MAX_LABELS)break;dropLabel(l);}
  labels=labels.filter(l=>l.box.isConnected);}
// the picture names what the voice says now, as it says it; an earlier line's labels stay on the shot, quieter, so the
// picture builds up like a diagram, at most MAX_LABELS at once (the oldest leave first). Navin, 23 November 2026, on 11.6.2a:
// thirteen labels stood on one line ("khichdi"), so labels left after the next line, five at most; Navin, 24 November 2026,
// on r2 of 11.6.3b: "labelling bahut jyada kam ho gayi hai ... itni use karo ki baat clear ho jaaye script ke bolne ke sath"
const MAX_LABELS=8;
function dropLabel(l){l.box.remove();l.dot.remove();l.lead.remove();}
function retireLabels(){labels.forEach(l=>{if(!l.math&&l.k<labelRound){l.box.classList.remove('new');l.box.classList.add('old');}});}
function placeLabels(){const now=performance.now();for(const l of labels){const on=now>=l.showAt&&cam.fade>=.98&&cam.s>=.98;const [sx,sy]=toScreen(l.x,l.y);const y=sy*.5625;
    const right=sx<62,lx=right?sx+5:sx-5,ly=Math.max(3,Math.min(53,y-4));
    if(l.math){l.box.style.left=sx+'%';l.box.style.top=(sy/1)+'%';l.box.style.transform='translate(-50%,-50%)';l.dot.style.opacity=l.lead.style.opacity=0;}
    else{l.dot.setAttribute('cx',sx);l.dot.setAttribute('cy',y);l.lead.setAttribute('x1',sx);l.lead.setAttribute('y1',y);l.lead.setAttribute('x2',lx);l.lead.setAttribute('y2',ly);
      l.box.style.top=(ly/56.25*100)+'%';if(right){l.box.style.left=lx+'%';l.box.style.right='';}else{l.box.style.right=(100-lx)+'%';l.box.style.left='';}
      l.dot.style.opacity=l.lead.style.opacity=on?1:0;}
    l.box.style.opacity=on?1:0;l.dy=0;}
  // keep label boxes apart: a later label that overlaps an earlier one moves down (its leader line follows). A wheel's
  // name sits fixed in its centre, so a pin that would cover it moves too (Photosynthesis q05, 21 November 2026: the
  // "6 H2O" pin sat on "Water-hisaab"); a few passes, so a label pushed onto another moves on past it.
  const H=$('stage').getBoundingClientRect().height||1,shown=labels.filter(l=>l.box.style.opacity==='1'&&!l.math),
    fixed=labels.filter(l=>l.box.style.opacity==='1'&&l.math);
  for(let i=0;i<shown.length;i++){for(let pass=0;pass<4;pass++){const a=shown[i].box.getBoundingClientRect();
      const b=[...fixed,...shown.slice(0,i)].map(l=>l.box.getBoundingClientRect())
        .find(b=>a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top);
      if(!b)break;const push=(b.bottom-a.top+4)/H*100;const top=parseFloat(shown[i].box.style.top)+push;
      shown[i].box.style.top=top+'%';shown[i].lead.setAttribute('y2',top*.5625);}}}

// --- arrows and effects (world space: they zoom with the picture) ----------------------------------------------------------
// a new step quiets the steps before it: their arrows, arrow labels, step numbers and counts stay, dimmed
function quiet(){wsvg.querySelectorAll('.ar,.ah').forEach(e=>e.classList.add('old'));fxBox.querySelectorAll('.flab,.step,.beads').forEach(e=>e.classList.add('old'));}
function stepMark(t){const a=(t.arrows||[])[0],p=(t.pins||[])[0];const at=a&&a.points&&a.points[0]?a.points[0]:p?[p.x,p.y]:[50,10];
  const b=el('div','step',String(t.step));b.style.left=Math.min(96,Math.max(4,at[0]))+'%';b.style.top=Math.min(94,Math.max(6,at[1]))+'%';fxBox.appendChild(b);}
const BEAD={gold:'#e8b948',green:'#7fc45a',blue:'#5fb8e6',red:'#e0604a',white:'#f2f2ee',purple:'#a982d6'};
// a run of like groups (3 RuBP of 5 carbons) is labelled once, at its end, as a teacher writes 5 + 5 + 5 RuBP carbon
function beadRow(groups,box){const like=(a,b)=>!!(a&&b&&a.label===b.label&&a.colour===b.colour);groups.forEach((g,i)=>{if(i)box.appendChild(el('span','','+'));const r=el('span','g');
  for(let n=0;n<Math.min(12,Math.max(0,g.n|0));n++){const b=el('b');b.style.background=BEAD[g.colour]||BEAD.green;b.style.animationDelay=(n*.08)+'s';r.appendChild(b);}
  if(g.label&&!like(g,groups[i+1]))r.appendChild(el('span','',g.label));box.appendChild(r);});}
// the row fits the picture: shrunk to at most 94% of its width (down to half size), wrapped onto lines past that, and kept
// inside the edges (the first Calvin heading film, 23 November 2026: an 18-carbon ledger ran off both sides)
function fitBeads(box){const W=fxBox.clientWidth;if(!W)return;const room=W*.94,w=box.scrollWidth;let f=1;
  if(w>room){f=Math.max(.5,room/w);if(w*f>room){box.classList.add('wrap');f=1;}}box.style.setProperty('--fit',f.toFixed(3));
  const half=Math.min(box.scrollWidth*f,room)/2/W*100,x=parseFloat(box.style.left)||50;box.style.left=Math.min(100-3-half,Math.max(3+half,x)).toFixed(1)+'%';}
function countAdd(c){if(!c||!(c.groups||[]).length)return;const box=el('div','beads');box.style.left=(c.x==null?50:c.x)+'%';box.style.top=(c.y==null?86:c.y)+'%';
  // a new count written where an earlier one stands takes its place, as a teacher wipes that part of the board
  const top=c.y==null?86:c.y;fxBox.querySelectorAll('.beads').forEach(o=>{if(Math.abs((parseFloat(o.style.top)||86)-top)<12)o.remove();});
  beadRow(c.groups,box);if((c.then||[]).length){const t=el('span','then');t.appendChild(el('span','','='));beadRow(c.then,t);box.appendChild(t);}fxBox.appendChild(box);fitBeads(box);}
function fxAdd(arrows,effects){arrows.forEach(a=>{const P=a.points.map(p=>[p[0],p[1]*.5625]);let d='M'+P[0][0]+' '+P[0][1];for(let i=1;i<P.length;i++)d+=' L'+P[i][0]+' '+P[i][1];
    sv('path',{d,class:'ar',pathLength:'100'},wsvg);const e=P[P.length-1],f=P[P.length-2],g=Math.atan2(e[1]-f[1],e[0]-f[0]);
    const h=sv('path',{class:'ah',d:`M${e[0]+Math.cos(g)*2} ${e[1]+Math.sin(g)*2} L${e[0]+Math.cos(g+2.5)*2} ${e[1]+Math.sin(g+2.5)*2} L${e[0]+Math.cos(g-2.5)*2} ${e[1]+Math.sin(g-2.5)*2}Z`},wsvg);h.style.fill='#e8c26a';h.style.animation='inn .3s 1s both';
    if(a.label){const m=a.points[Math.floor(a.points.length/2)];const lb=el('div','flab',a.label);lb.style.left=m[0]+'%';lb.style.top=m[1]+'%';fxBox.appendChild(lb);}});
  effects.forEach(f=>{const e=el('div',f.type);e.style.left=f.x0+'%';e.style.top=f.y0+'%';e.style.width=Math.max(2,f.x1-f.x0)+'%';e.style.height=Math.max(2,f.y1-f.y0)+'%';
    if(f.type==='spin'){e.style.left=((f.x0+f.x1)/2)+'%';e.style.top=((f.y0+f.y1)/2)+'%';e.style.width=Math.max(4,Math.min(f.x1-f.x0,(f.y1-f.y0)*.5625))+'%';e.style.height='';e.appendChild(el('i'));}
    if(f.type==='rise')for(let i=0;i<12;i++){const ii=el('i');ii.style.left=(4+i*8)+'%';ii.style.animationDelay=(i*.37%2.6)+'s';e.appendChild(ii);}fxBox.appendChild(e);});}

// --- shots and sentences -------------------------------------------------------------------------------------------------
function clearShot(){actors=[];labels=[];texts=[];parts={};riders=[];$('world').innerHTML='';$('ssvg').innerHTML='';$('labels').innerHTML='';}
function build(i){const s=F.shots[i];clearShot();
  if(s.type==='diagram'){const d=el('div','svg base');d.innerHTML=s.svg;$('world').appendChild(d);}else{const im=el('img');im.alt='';im.src=s.img||'';$('world').appendChild(im);}
  (s.parts||[]).forEach(p=>{if(p.img&&p.box)$('world').appendChild(partEl(p));});
  worldLayers();if(s.type==='diagram')textLayer();$('key').textContent=s.key||'';$('sc').textContent=s.title||'';}
function show(i,k,viaDive){const my=++token;const s=F.shots[i];si=i;ki=0;
  // the next picture opens inside the dive point while the old picture zooms past and fades (one world, no slide cut);
  // a shot without a dive cross-fades
  if(viaDive&&!reduced&&$('world').childNodes.length){const old=$('world'),ghost=old.cloneNode(true);ghost.removeAttribute('id');ghost.classList.add('ghost');
    $('stage').insertBefore(ghost,old);const g0={ox:cam.ox,oy:cam.oy,s:cam.s},d=s.dive||{x:50,y:50},deep=!!s.dive,ms=deep?1600:900;
    build(i);cam.to=null;cam.ox=d.x;cam.oy=d.y;cam.s=deep?.3:1;cam.fade=0;if(deep)camTo(50,50,1,ms*.78);const t0=performance.now(),w=$('world');
    // the new picture opens as a soft round lens inside the point; the old picture keeps filling the frame around it. The lens
    // stays inside the picture's own edges until the picture fills the frame (at 78% of the move), so its rectangle never shows
    // (the first living film showed a box growing), then opens to the corners
    const lens=r=>{const m=r>=140?'':`radial-gradient(ellipse at 50% 50%,#000 ${r}%,transparent ${r+25}%)`;w.style.maskImage=w.style.webkitMaskImage=m;};
    const step=now=>{if(my!==token){ghost.remove();lens(999);return;}const u=Math.min(1,(now-t0)/ms),e=ease(u);
      ghost.style.transformOrigin=(g0.ox+(d.x-g0.ox)*e)+'% '+(g0.oy+(d.y-g0.oy)*e)+'%';ghost.style.transform='scale('+(g0.s*(1+(deep?5:0)*e)).toFixed(3)+')';
      ghost.style.opacity=(deep?1-Math.max(0,(u-.85)/.15):1-e).toFixed(3);cam.fade=Math.min(1,e*(deep?3:1.5));
      if(deep)lens(u<.78?18+ease(u/.78)*22:40+(u-.78)/.22*105);
      if(u<1)requestAnimationFrame(step);else{ghost.remove();cam.fade=1;lens(999);}};
    requestAnimationFrame(step);setTimeout(()=>{if(my===token)sentence(k||0);},deep?ms:200);return;}
  build(i);cam.to=null;cam.ox=50;cam.oy=50;cam.s=1;cam.fade=1;partsReplay(k||0);sentence(k||0);}
function sentence(k){const s=F.shots[si];const t=s.sentences[k];if(!t)return;ki=k;labelRound++;retireLabels();$('sub').textContent=t.text;const now=performance.now();bar(si,k,playing);
  const zm=t.zoom||{},tr=t.track||[];if(!(tr[0]&&tr[0].at<.8))camTo(zm.x==null?50:zm.x,zm.y==null?50:zm.y,Math.min(2.2,Math.max(1,zm.scale||1)),1700);
  // the camera goes close to what the voice names now and follows a thing that travels (Navin, 24 November 2026: "zoom
  // effects camera angles ka behtreen use krke taaki user ka dhyan script ke sath bandh jaaye"); BIE times it to the words
  {const my=token;tr.forEach(c=>setTimeout(()=>{if(my===token&&ki===k)camTo(c.x,c.y,Math.min(2.2,Math.max(1,c.scale||1)),c.ms||1200);},Math.max(0,(c.at||0)*1000)));}
  // a new step: what earlier steps sent moving goes quiet too, so the new step's flow is the one that glows (F1)
  if(t.step||((t.arrows||[]).length&&k))quiet();if(t.step){actors.forEach(a=>{if(a.kind==='move')a.dim=true;});stepMark(t);}countAdd(t.count);
  // a pin or a move starts as the voice says its name (at, seconds; Navin on the first 11.6.3b film, 23 November 2026:
  // "bolte huye screen par wahi step par dhyan jata hai jo ho rha hai"); one the line never names starts with the line
  (t.pins||[]).forEach(p=>addLabel(p.t,p.x,p.y,'pin new',now+(p.at!=null?p.at*1000:0)));fxAdd(t.arrows||[],t.effects||[]);
  handOff(t.moves||[],now);(t.moves||[]).forEach(m=>addMove(m,now+(m.at!=null?m.at*1000:300),now+300+(t.dur||0)*1000));(t.grows||[]).forEach(g=>addGrow(g,now+300));(t.fuses||[]).forEach((f,i)=>addFuse(f,now+400+i*1200));
  (t.reacts||[]).forEach((r,i)=>addReact(r,now+300+(r.delay!=null?r.delay*1000:i*1400)));(t.cycles||[]).forEach(c=>addCycle(c,now+300));
  (t.acts||[]).forEach((a,i)=>actors.push({kind:'act',a,born:now+(a.at!=null?a.at*1000:400+i*1400),done:false}));
  const w=$('world');w.querySelectorAll('.lit').forEach(e=>e.classList.remove('lit'));(t.focus||[]).forEach(id=>{const q=CSS.escape(id);w.querySelectorAll('#'+q+',[data-oid="'+q+'"]').forEach(e=>e.classList.add('lit'));});
  if(playing)speak(t);}
function speak(t){clearTimeout(timer);const my=token;const later=ms=>{timer=setTimeout(()=>{if(my===token)next();},ms);};
  if(!t.audio){later(t.dur*1000);return;}
  BIEVoice.play(t.audio,{done:()=>later(t.after!=null?t.after*1000:450),fail:()=>later(t.dur*1000)});
  const s=F.shots[si],n=s.sentences[ki+1]||((F.shots[si+1]||{}).sentences||[])[0];if(n)BIEVoice.prefetch(n.audio);}
function next(){if(!playing)return;const s=F.shots[si];if(ki+1<s.sentences.length){sentence(ki+1);return;}if(si+1<F.shots.length){show(si+1,0,true);return;}stop();}
BIEVoice.onState=v=>{$('vnote').hidden=v!=='blocked';};
function stop(){playing=false;clearTimeout(timer);BIEVoice.stop();freezeBar();$('play').innerHTML='&#9654; Film chalaiye';}
$('play').onclick=()=>{BIEVoice.unlock();if(playing){stop();return;}playing=true;$('play').innerHTML='&#10074;&#10074; Rokiye';bar(si,ki,true);speak(F.shots[si].sentences[ki]);};
$('again').onclick=()=>{stop();show(0,0);};
window.BIEFilm={state:()=>({shot:si,sentence:ki,playing,camera:{ox:cam.ox,oy:cam.oy,s:cam.s},actors:actors.map(a=>a.kind),labels:labels.length,voice:BIEVoice.state,words:texts.length,cut:texts.filter(t=>t.classList.contains('cut')).length,
  parts:Object.values(parts).map(P=>Object.assign({id:P.id,spin:P.el.classList.contains('p-spin'),roll:P.el.classList.contains('p-roll'),riders:P.riders.length},P.now)),go:(i,k)=>{stop();show(i,k);}})};
show(0,0);
</script></body></html>
