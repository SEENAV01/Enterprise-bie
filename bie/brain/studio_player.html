<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIE film</title>
<style>
:root{--ink:#eef3f1;--gold:#e8c26a;--bg:#0c1416;--tint:#2c6e87}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.film{max-width:1100px;margin:0 auto;padding:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px;font-size:.8rem;letter-spacing:.06em}
.top .mark{color:var(--gold);font-weight:700}.top .sc{color:#a9bcc0;text-align:right}
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:#081014}
.zoomer{position:absolute;inset:0;transform-origin:50% 50%;transition:transform 1.4s cubic-bezier(.3,.6,.3,1)}
.zoomer img{width:100%;height:100%;object-fit:cover;display:block}
.zoomer .svg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f7f4ec}
.zoomer .svg svg{width:100%;height:100%}
.svg .lit{filter:drop-shadow(0 0 6px #e8a93a);stroke:#c8492b!important;stroke-width:3!important}
.layer{position:absolute;inset:0;pointer-events:none}.layer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pin{position:absolute;transform:translateY(-50%);background:rgba(8,26,33,.9);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:3px 9px;font-size:clamp(.62rem,1.3vw,.9rem);font-weight:600;white-space:nowrap;animation:inn .5s both}
.pin.new{background:var(--gold);color:#17140a;border-color:var(--gold)}
.dot{fill:none;stroke:var(--gold);stroke-width:.35}.lead{stroke:rgba(255,248,225,.9);stroke-width:.18}
.ar{fill:none;stroke:var(--gold);stroke-width:.7;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.1s ease-out forwards}
.flab{position:absolute;transform:translate(-50%,-130%);background:rgba(8,26,33,.9);border-radius:6px;padding:2px 8px;font-size:clamp(.6rem,1.1vw,.82rem);animation:inn .5s .8s both}
.rain{position:absolute;background:repeating-linear-gradient(105deg,rgba(225,238,255,0) 0 7px,rgba(225,238,255,.5) 7px 8px);background-size:60px 60px;animation:rain .45s linear infinite,inn .8s both}
.rise i{position:absolute;bottom:0;width:2px;height:34%;background:linear-gradient(to top,transparent,#ffd98a);animation:rise 2.6s ease-in infinite;opacity:0}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,190,90,.75) 0,transparent 70%);animation:glow 2.2s ease-in-out infinite,inn .6s both}
@keyframes inn{from{opacity:0}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes rain{to{background-position:-14px 60px}}
@keyframes rise{0%{transform:translateY(40%);opacity:0}25%{opacity:.95}100%{transform:translateY(-110%);opacity:0}}
@keyframes glow{50%{transform:scale(1.3)}}
.band{border-top:1px solid var(--gold);margin-top:8px;padding:10px 4px 4px}
.key{color:var(--gold);font-weight:600;font-size:clamp(.9rem,1.8vw,1.1rem);min-height:1.4em}
.sub{font-size:clamp(.95rem,2vw,1.2rem);line-height:1.5;min-height:3em;margin-top:6px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ctl button{background:#132226;color:var(--ink);border:1px solid #2c4248;border-radius:9px;padding:9px 14px;font-size:.95rem;min-height:42px}
.ctl .play{background:var(--gold);color:#17140a;border-color:var(--gold);font-weight:700}
.dots{display:flex;gap:6px;flex-wrap:wrap}.dots button{min-height:30px;padding:4px 9px;font-size:.78rem}
.dots button[aria-current=true]{border-color:var(--gold);color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div class="film">
<div class="top"><span class="mark" id="mark">BIE</span><span class="sc" id="sc"></span></div>
<div class="stage" id="stage"><div class="zoomer" id="zoom"></div><div class="layer" id="fx"></div><div class="layer" id="pins"></div></div>
<div class="band"><div class="key" id="key"></div><div class="sub" id="sub"></div></div>
<div class="ctl"><button class="play" id="play">&#9654; Film chalaiye</button><button id="again">&#8634; Shuru se</button><div class="dots" id="dots"></div></div>
<audio id="au" preload="auto"></audio>
</div>
<script>
const F=/*__FILM__*/null;const NS='http://www.w3.org/2000/svg';const $=id=>document.getElementById(id);
const au=$('au');let si=0,ki=0,playing=false,timer=null;const blobs={};
document.documentElement.style.setProperty('--tint',F.tint||'#2c6e87');$('mark').textContent='BIE · '+(F.chapter||'');
function blobURL(u){if(!u||!u.startsWith('data:'))return u;if(blobs[u])return blobs[u];const [h,b]=u.split(',');const m=h.slice(5).split(';')[0];
  const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return blobs[u]=URL.createObjectURL(new Blob([a],{type:m}));}
F.shots.forEach((s,i)=>{const b=document.createElement('button');b.textContent=(i+1);b.title=s.title||'';b.onclick=()=>{stop();show(i,0);};$('dots').appendChild(b);});
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function show(i,k){si=i;ki=0;const s=F.shots[i];const z=$('zoom');z.innerHTML='';z.style.transform='none';$('pins').innerHTML='';$('fx').innerHTML='';
  if(s.type==='diagram'){const d=el('div','svg');d.innerHTML=s.svg;z.appendChild(d);}else{const im=el('img');im.alt='';im.src=s.img||'';z.appendChild(im);}
  $('key').textContent=s.key||'';$('sc').textContent=(s.title||'')+' · '+String(i+1).padStart(2,'0')+' / '+String(F.shots.length).padStart(2,'0');
  [...$('dots').children].forEach((b,j)=>b.setAttribute('aria-current',String(j===i)));sentence(k||0);}
function pinsAdd(list){const host=$('pins');let svg=host.querySelector('svg');if(!svg){svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 100 56.25');svg.setAttribute('preserveAspectRatio','none');host.appendChild(svg);}
  host.querySelectorAll('.pin.new').forEach(p=>p.classList.remove('new'));
  list.forEach(p=>{const y=p.y*.5625,right=p.x<62,lx=right?p.x+5:p.x-5,ly=Math.max(3,Math.min(53,y-4));
    const c=document.createElementNS(NS,'ellipse');c.setAttribute('class','dot');c.setAttribute('cx',p.x);c.setAttribute('cy',y);c.setAttribute('rx',2);c.setAttribute('ry',2);svg.appendChild(c);
    const l=document.createElementNS(NS,'line');l.setAttribute('class','lead');l.setAttribute('x1',p.x);l.setAttribute('y1',y);l.setAttribute('x2',lx);l.setAttribute('y2',ly);svg.appendChild(l);
    const b=el('div','pin new',p.t);b.style.top=(ly/56.25*100)+'%';if(right)b.style.left=lx+'%';else b.style.right=(100-lx)+'%';host.appendChild(b);});}
function fxAdd(arrows,effects){const host=$('fx');let svg=host.querySelector('svg');if(!svg){svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 100 56.25');svg.setAttribute('preserveAspectRatio','none');host.appendChild(svg);}
  arrows.forEach(a=>{const P=a.points.map(p=>[p[0],p[1]*.5625]);let d='M'+P[0][0]+' '+P[0][1];for(let i=1;i<P.length;i++)d+=' L'+P[i][0]+' '+P[i][1];
    const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class','ar');p.setAttribute('pathLength','100');svg.appendChild(p);
    const e=P[P.length-1],f=P[P.length-2],g=Math.atan2(e[1]-f[1],e[0]-f[0]),h=document.createElementNS(NS,'path');
    h.setAttribute('d',`M${e[0]+Math.cos(g)*2} ${e[1]+Math.sin(g)*2} L${e[0]+Math.cos(g+2.5)*2} ${e[1]+Math.sin(g+2.5)*2} L${e[0]+Math.cos(g-2.5)*2} ${e[1]+Math.sin(g-2.5)*2}Z`);h.style.fill='#e8c26a';h.style.animation='inn .3s 1s both';svg.appendChild(h);
    if(a.label){const m=a.points[Math.floor(a.points.length/2)];const lb=el('div','flab',a.label);lb.style.left=m[0]+'%';lb.style.top=m[1]+'%';host.appendChild(lb);}});
  effects.forEach(f=>{const e=el('div',f.type);e.style.left=f.x0+'%';e.style.top=f.y0+'%';e.style.width=Math.max(2,f.x1-f.x0)+'%';e.style.height=Math.max(2,f.y1-f.y0)+'%';
    if(f.type==='rise')for(let i=0;i<12;i++){const ii=el('i');ii.style.left=(4+i*8)+'%';ii.style.animationDelay=(i*.37%2.6)+'s';e.appendChild(ii);}host.appendChild(e);});}
function sentence(k){const s=F.shots[si];const t=s.sentences[k];if(!t)return;ki=k;$('sub').textContent=t.text;
  const zm=t.zoom||{};const sc=Math.min(1.18,Math.max(1,zm.scale||1));const z=$('zoom');z.style.transformOrigin=(zm.x||50)+'% '+(zm.y||50)+'%';z.style.transform='scale('+sc+')';
  pinsAdd(t.pins||[]);fxAdd(t.arrows||[],t.effects||[]);
  z.querySelectorAll('.lit').forEach(e=>e.classList.remove('lit'));(t.focus||[]).forEach(id=>{const e=z.querySelector('#'+CSS.escape(id));if(e)e.classList.add('lit');});
  if(playing)speak(t);}
function speak(t){clearTimeout(timer);if(t.audio){au.src=blobURL(t.audio);au.currentTime=0;const p=au.play();if(p)p.catch(()=>{timer=setTimeout(next,t.dur*1000);});}else timer=setTimeout(next,t.dur*1000);}
function next(){if(!playing)return;const s=F.shots[si];if(ki+1<s.sentences.length){sentence(ki+1);return;}if(si+1<F.shots.length){show(si+1,0);return;}stop();}
au.addEventListener('ended',()=>setTimeout(next,350));
function stop(){playing=false;clearTimeout(timer);au.pause();$('play').innerHTML='&#9654; Film chalaiye';}
$('play').onclick=()=>{if(playing){stop();return;}playing=true;$('play').innerHTML='&#10074;&#10074; Rokiye';speak(F.shots[si].sentences[ki]);};
$('again').onclick=()=>{stop();show(0,0);};
show(0,0);
</script></body></html>
