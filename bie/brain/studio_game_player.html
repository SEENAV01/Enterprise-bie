<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIE game</title>
<style>
:root{--ink:#eef3ef;--mute:#a8bab2;--gold:#e8c26a;--bg:#0b1513;--card:#12201d;--line:#26403a;--tint:#3f7d4e;--ok:#7fd49a;--bad:#ff8f7a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:10px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0 12px;border-bottom:1px solid var(--line);font-size:.8rem;letter-spacing:.06em}
.top .mark{color:var(--gold);font-weight:700}.top .score{color:var(--mute)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(1.7rem,5vw,2.8rem);line-height:1.1;margin:18px 0 6px}
.big{color:var(--mute);margin:0 0 18px;font-size:1.02rem;line-height:1.5}
.world{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.world h2{margin:0;font-size:1.05rem;color:var(--gold)}.world p{margin:4px 0 10px;color:var(--mute);font-size:.92rem}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.stbtn{text-align:left;background:#0e1a17;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:56px;display:flex;gap:10px;align-items:center}
.stbtn b{color:var(--gold);font-size:.8rem;min-width:2.2em}.stbtn span{flex:1;font-size:.93rem;line-height:1.3}.stbtn i{font-style:normal;color:var(--gold);font-size:.8rem}
.stbtn.done{border-color:var(--tint)}
.hero{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin:14px 0 10px;min-height:120px;background:linear-gradient(120deg,var(--card),var(--tint))}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero .t{position:relative;padding:18px;max-width:640px}.hero h1{margin:0 0 6px;font-size:clamp(1.4rem,4.4vw,2.3rem)}.hero p{margin:0;line-height:1.5}
.play{display:grid;grid-template-columns:1.35fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
@media (max-width:820px){.play{grid-template-columns:1fr}}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);grid-column:1/-1;font-size:.82rem;color:var(--mute)}
.bar .rd{padding:3px 9px;border-radius:99px;border:1px solid var(--line)}.bar .rd.on{color:var(--gold);border-color:var(--gold)}.bar .rd.ok{color:var(--ok);border-color:var(--ok)}
.bar .sp{flex:1}.bar button{background:transparent;border:1px solid var(--line);border-radius:9px;padding:6px 10px;min-height:36px}
.scene{position:relative;background:radial-gradient(circle at 30% 20%,#18302a,#0c1714);touch-action:none}
.scene svg{display:block;width:100%;height:auto}
.scene svg *{transform-box:fill-box;transform-origin:center}
.scene .zone{outline:none;filter:drop-shadow(0 0 7px var(--gold))}
.panel{padding:16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
@media (max-width:820px){.panel{border-left:0;border-top:1px solid var(--line)}}
.prompt{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.2rem,3.4vw,1.6rem);line-height:1.25;color:#f4ead0;margin:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:#0e1a17;border:1px solid #3a5a52;border-radius:10px;padding:10px 14px;min-height:46px;text-align:left;line-height:1.3;user-select:none;-webkit-user-select:none;touch-action:none}
.opt.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,194,106,.35)}
.opt.ok{border-color:var(--ok);color:var(--ok)}.opt.bad{border-color:var(--bad);color:var(--bad)}.opt:disabled{opacity:.55;cursor:default}
.opt.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.seq{display:flex;flex-wrap:wrap;gap:6px;min-height:10px}.seq span{background:#0e1a17;border:1px solid var(--ok);color:var(--ok);border-radius:8px;padding:6px 10px;font-size:.88rem}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.grp{background:#0e1a17;border:1px dashed #4a6c63;border-radius:10px;padding:10px;min-height:70px;text-align:left}
.grp b{display:block;color:var(--gold);font-size:.9rem;margin-bottom:6px}.grp small{display:block;color:var(--ok);font-size:.82rem;line-height:1.4}
.slider{display:flex;flex-direction:column;gap:6px}.slider input{width:100%;accent-color:var(--gold)}
.stops{display:flex;justify-content:space-between;gap:6px;font-size:.82rem;color:var(--mute)}.stops span.on{color:var(--gold)}
.fb{border-left:3px solid var(--line);background:#0e1a17;padding:10px 12px;font-size:.95rem;line-height:1.45;min-height:44px}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.kya{border:1px solid var(--line);border-radius:10px;padding:12px;line-height:1.5}.kya h3{margin:0 0 4px;font-size:.75rem;letter-spacing:.12em;color:var(--gold)}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts button{border-radius:10px;padding:10px 16px;min-height:46px;border:1px solid var(--line);background:#0e1a17}
.acts .go{background:var(--gold);border-color:var(--gold);color:#18140a;font-weight:700}
.ghost{position:fixed;pointer-events:none;z-index:9;transform:translate(-50%,-60%);opacity:.92}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div class="wrap">
<div class="top"><span class="mark" id="mark">BIE</span><span class="score" id="score"></span></div>
<div id="home"></div>
<div id="stage" class="hidden">
  <div class="hero" id="hero"><img id="heroimg" alt=""><div class="t"><h1 id="stitle"></h1><p id="sintro"></p></div></div>
  <div class="play">
    <div class="bar" id="bar"></div>
    <div class="scene" id="scene"></div>
    <div class="panel">
      <p class="prompt" id="prompt"></p>
      <div id="ctl"></div>
      <div class="fb" id="fb"></div>
      <div class="kya hidden" id="kya"><h3>KYA HUA</h3><div id="kyat"></div></div>
      <div class="acts" id="acts"></div>
    </div>
  </div>
</div>
</div>
<script>
const G=/*__GAME__*/null;const $=id=>document.getElementById(id);
const CHOOSE=['choose_and_see','predict_then_run','slider_cause_effect'],DRAG=['drag_to_target','assemble_parts'],ORDER=['build_sequence','route_flow'];
document.documentElement.style.setProperty('--tint',G.tint||'#3f7d4e');$('mark').textContent='BIE · '+(G.chapter||'')+' · Game';
let stars={};try{stars=JSON.parse(localStorage.getItem('bie-game-'+G.chapter)||'{}')}catch(e){}
function save(){try{localStorage.setItem('bie-game-'+G.chapter,JSON.stringify(stars))}catch(e){}}
const ALL=[];G.worlds.forEach(w=>w.stages.forEach(s=>ALL.push(s)));
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function total(){let n=0;Object.values(stars).forEach(v=>n+=v);$('score').textContent='★ '+n+' / '+ALL.reduce((a,s)=>a+3*s.rounds.length,0);}
function home(){$('stage').classList.add('hidden');const h=$('home');h.classList.remove('hidden');h.innerHTML='';
  h.appendChild(el('h1',null,G.chapter||'Chapter'));h.appendChild(el('p','big',G.big||''));
  G.worlds.forEach(w=>{const c=el('div','world');c.appendChild(el('h2',null,w.title));c.appendChild(el('p',null,w.line||''));const g=el('div','stages');
    w.stages.forEach(s=>{const b=el('button','stbtn');const got=s.rounds.reduce((a,r,i)=>a+(stars[s.qid+':'+i]||0),0);if(got)b.classList.add('done');
      b.appendChild(el('b',null,s.qid.toUpperCase()));b.appendChild(el('span',null,s.title||s.question));b.appendChild(el('i',null,got?'★'+got:''));
      b.onclick=()=>open(ALL.indexOf(s));g.appendChild(b);});c.appendChild(g);h.appendChild(c);});total();window.scrollTo(0,0);}
let S=null,si=0,ri=0,busy=false,miss=0,snap=null,sel=null,placed=new Set(),nextOrder=1;
function q(id){return $('scene').querySelector('#'+CSS.escape(id));}
function st(e){if(!e._s)e._s={tx:0,ty:0,s:1,r:0,o:1,fill:'',dash:false};return e._s;}
function paint(e,s){e.style.translate=s.tx+'px '+s.ty+'px';e.style.scale=String(s.s);e.style.rotate=s.r+'deg';e.style.opacity=String(s.o);
  if(s.o===0)e.style.pointerEvents='none';else e.style.pointerEvents='';}
function kf(s){return{translate:s.tx+'px '+s.ty+'px',scale:String(s.s),rotate:s.r+'deg',opacity:String(s.o)};}
function shapes(e){const L=[e,...e.querySelectorAll('*')];return L.filter(x=>typeof x.getTotalLength==='function');}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
async function act(a){const e=q(a.target);if(!e)return;const ms=Math.max(150,Math.min(3000,a.ms||700));const s=st(e),f={...s};
  const ease='cubic-bezier(.3,.7,.3,1)';
  if(a.do==='glow'){e.animate([{filter:'none'},{filter:'drop-shadow(0 0 12px #ffd27a)'},{filter:'none'}],{duration:ms,iterations:2});return wait(ms);}
  if(a.do==='pulse'){e.animate([kf(s),{...kf(s),scale:String(s.s*1.18)},kf(s)],{duration:ms/2,iterations:2});return wait(ms);}
  if(a.do==='shake'){const k=x=>({...kf(s),translate:(s.tx+x)+'px '+s.ty+'px'});e.animate([kf(s),k(-12),k(12),k(-8),k(8),kf(s)],{duration:ms});return wait(ms);}
  if(a.do==='color'){const c=a.color||'#e8c26a';const L=[e,...e.querySelectorAll('path,rect,circle,ellipse,polygon,polyline,line,text')];
    L.forEach(x=>{const tag=x.tagName.toLowerCase();if(tag==='line'||tag==='polyline'||(x.getAttribute('fill')==='none'))x.style.stroke=c;else x.style.fill=c;x.style.transition='fill '+ms+'ms, stroke '+ms+'ms';});s.fill=c;return wait(ms);}
  if(a.do==='draw'){s.o=1;paint(e,s);s.dash=true;shapes(e).forEach(x=>{let n=0;try{n=x.getTotalLength()}catch(err){}if(!n)return;x.style.strokeDasharray=n;
      x.animate([{strokeDashoffset:n},{strokeDashoffset:0}],{duration:ms,easing:ease});x.style.strokeDashoffset=0;});return wait(ms);}
  if(a.do==='show'){s.o=1;if(f.o===0){f.s=s.s*.85;}}
  else if(a.do==='hide'){s.o=0;}
  else if(a.do==='move'){s.tx+=a.x||0;s.ty+=a.y||0;}
  else if(a.do==='fly'){s.tx+=a.x||0;s.ty+=a.y||-200;s.r+=540;s.o=0;}
  else if(a.do==='fall'){s.tx+=a.x||0;s.ty+=a.y||260;s.r+=35;s.o=0;}
  else if(a.do==='grow'){s.s*=Math.max(.3,Math.min(3,a.scale||1.4));}
  else if(a.do==='shrink'){const k=a.scale||.6;s.s*=k>1?1/k:Math.max(.3,k);}
  paint(e,s);e.animate([kf(f),kf(s)],{duration:ms,easing:a.do==='fall'?'cubic-bezier(.5,0,.9,.6)':ease});return wait(ms);}
async function run(list){busy=true;for(const a of list||[])await act(a);busy=false;}
function take(){const m=new Map();$('scene').querySelectorAll('[id]').forEach(e=>m.set(e,{...st(e)}));return m;}
function restore(m){$('scene').querySelectorAll('[id]').forEach(e=>{e.getAnimations({subtree:true}).forEach(a=>a.cancel());const s=m.get(e);if(!s)return;e._s={...s};paint(e,e._s);
  if(!s.fill)[e,...e.querySelectorAll('*')].forEach(x=>{x.style.fill='';x.style.stroke='';});
  if(!s.dash)shapes(e).forEach(x=>{x.style.strokeDasharray='';x.style.strokeDashoffset='';});});}
function open(i){si=i;S=ALL[i];$('home').classList.add('hidden');$('stage').classList.remove('hidden');
  $('stitle').textContent=S.title||S.question;$('sintro').textContent=S.intro||S.question||'';
  const hi=$('heroimg');if(S.hero){hi.src=S.hero;hi.classList.remove('hidden');}else hi.classList.add('hidden');
  const sc=$('scene');sc.innerHTML=S.svg||'';sc.querySelectorAll('[id]').forEach(e=>{e._s=null;const s=st(e);if(S.hidden.includes(e.id))s.o=0;paint(e,s);});
  round(0);window.scrollTo(0,0);}
function bar(){const b=$('bar');b.innerHTML='';const back=el('button',null,'← Saare stage');back.onclick=home;b.appendChild(back);
  b.appendChild(el('span',null,S.qid.toUpperCase()+' · '+(si+1)+'/'+ALL.length));
  S.rounds.forEach((r,i)=>{const d=el('span','rd'+(i===ri?' on':'')+((stars[S.qid+':'+i]||0)&&i!==ri?' ok':''),'Round '+(i+1));b.appendChild(d);});
  b.appendChild(el('span','sp'));const again=el('button',null,'↺ Dobara');again.onclick=()=>open(si);b.appendChild(again);}
function fb(t,kind){const f=$('fb');f.textContent=t||'';f.className='fb'+(kind?' '+kind:'');}
function acts(list){const a=$('acts');a.innerHTML='';list.forEach(([t,fn,go])=>{const b=el('button',go?'go':null,t);b.onclick=fn;a.appendChild(b);});}
function round(i){ri=i;miss=0;sel=null;placed=new Set();nextOrder=1;_now=null;$('scene').onclick=null;const R=S.rounds[i];snap=take();bar();
  $('prompt').textContent=R.prompt;fb('');$('kya').classList.add('hidden');acts([]);const c=$('ctl');c.innerHTML='';zones(false);
  if(CHOOSE.includes(R.mechanic))chooseUI(R,c);else if(DRAG.includes(R.mechanic))dragUI(R,c);else if(ORDER.includes(R.mechanic))orderUI(R,c);else sortUI(R,c);}
async function solved(R){await run(R.success_actions);const k=miss===0?3:miss===1?2:1;stars[S.qid+':'+ri]=Math.max(stars[S.qid+':'+ri]||0,k);save();total();bar();
  $('kyat').textContent=R.explain;$('kya').classList.remove('hidden');$('ctl').querySelectorAll('button,input').forEach(b=>b.disabled=true);
  const more=ri+1<S.rounds.length;acts([[more?'Agla round →':(si+1<ALL.length?'Agla stage →':'Saare stage'),()=>more?round(ri+1):(si+1<ALL.length?open(si+1):home()),true]]);
  fb('Shabaash! '+'★'.repeat(k),'ok');}
function chooseUI(R,c){if(R.mechanic==='slider_cause_effect'){const w=el('div','slider');const inp=el('input');inp.type='range';inp.min=0;inp.max=R.options.length-1;inp.step=1;inp.value=0;
    const stops=el('div','stops');R.options.forEach((o,j)=>stops.appendChild(el('span',j===0?'on':null,o.label)));
    inp.oninput=()=>[...stops.children].forEach((s,j)=>s.classList.toggle('on',j==inp.value));w.appendChild(inp);w.appendChild(stops);c.appendChild(w);
    const go=el('button','opt','▶ Chalao');go.onclick=()=>pick(R,R.options[+inp.value],go);c.appendChild(go);return;}
  const box=el('div','opts');R.options.forEach(o=>{const b=el('button','opt',o.label);b.onclick=()=>pick(R,o,b);box.appendChild(b);});c.appendChild(box);}
async function pick(R,o,b){if(busy)return;restore(snap);fb('');await run(o.actions);
  if(o.correct){b.classList.add('ok');fb(o.feedback,'ok');await wait(500);solved(R);}
  else{miss++;if(R.mechanic!=='slider_cause_effect'){b.classList.add('bad');b.disabled=true;}fb(o.feedback,'bad');acts([['↺ Phir koshish karo',()=>{restore(snap);fb('');acts([]);},false]]);}}
function zones(on,R){$('scene').querySelectorAll('.zone').forEach(e=>e.classList.remove('zone'));if(on&&R)R.options.forEach(o=>{if(o.target&&!placed.has(o)){const e=q(o.target);if(e)e.classList.add('zone');}});}
function hit(R,x,y){let best=null,area=1e12;const ids=[...new Set(R.options.map(o=>o.target).filter(Boolean))];
  ids.forEach(id=>{const e=q(id);if(!e)return;const r=e.getBoundingClientRect(),p=22;if(x>=r.left-p&&x<=r.right+p&&y>=r.top-p&&y<=r.bottom+p){const a=r.width*r.height;if(a<area){area=a;best=id;}}});return best;}
function dragUI(R,c){const box=el('div','opts');const need=R.options.filter(o=>o.correct).length;
  R.options.forEach(o=>{const b=el('button','opt',o.label);let sx=0,sy=0,down=false,ghost=null,dragged=false;
    b.onpointerdown=ev=>{if(b.disabled||busy)return;sx=ev.clientX;sy=ev.clientY;down=true;dragged=false;try{b.setPointerCapture(ev.pointerId)}catch(e){}};
    b.onpointermove=ev=>{if(!down)return;if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){ghost=el('div','opt sel ghost',o.label);document.body.appendChild(ghost);if(!sel||sel.o!==o)choose(o,b,R);}
      if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';}};
    b.onpointerup=ev=>{if(!down)return;down=false;if(ghost){ghost.remove();ghost=null;dragged=true;setTimeout(()=>dragged=false,80);drop(R,hit(R,ev.clientX,ev.clientY),need);}};
    b.onpointercancel=()=>{down=false;if(ghost){ghost.remove();ghost=null;}};
    b.onclick=()=>{if(dragged||b.disabled||busy)return;choose(o,b,R);};
    box.appendChild(b);});c.appendChild(box);
  $('scene').onclick=ev=>{if(sel&&!busy)drop(R,hit(R,ev.clientX,ev.clientY),need);};}
function choose(o,b,R){$('ctl').querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));if(sel&&sel.o===o){sel=null;zones(false);return;}sel={o,b};b.classList.add('sel');zones(true,R);fb('Ab scene mein sahi jagah par tap karo (ya kheench kar chhodo).');}
async function drop(R,id,need){if(!sel)return;const {o,b}=sel;sel=null;zones(false);b.classList.remove('sel');if(!id){fb('Scene mein kisi jagah par chhodo.');return;}
  if(o.correct&&o.target===id){placed.add(o);b.disabled=true;b.classList.add('ok');fb(o.feedback,'ok');await run(o.actions);_now=take();if(placed.size>=need)solved(R);}
  else{miss++;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),450);if(!o.correct){fb(o.feedback,'bad');await run(o.actions);await wait(700);restore(snapNow());}
    else fb('Yeh yahan nahi baithta. Socho, iska kaam kahan hota hai?','bad');}}
let _now=null;function snapNow(){return _now||snap;}
function orderUI(R,c){const seq=el('div','seq');const box=el('div','opts');const L=[...R.options].sort(()=>Math.random()-.5);
  L.forEach(o=>{const b=el('button','opt',o.label);b.onclick=async()=>{if(busy||b.disabled)return;
    if(o.order===nextOrder){nextOrder++;b.disabled=true;b.classList.add('ok');seq.appendChild(el('span',null,(o.order)+'. '+o.label));fb(o.feedback,'ok');await run(o.actions);_now=take();
      if(nextOrder>R.options.length)solved(R);}
    else{miss++;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),450);fb('Abhi yeh nahi. Isse pehle kya hota hai? Socho aur doosra chuno.','bad');}};box.appendChild(b);});
  c.appendChild(seq);c.appendChild(box);}
function sortUI(R,c){const box=el('div','opts');const gs=el('div','groups');const smalls={};let left=R.options.length;
  R.options.forEach(o=>{const b=el('button','opt',o.label);b.onclick=()=>{if(busy||b.disabled)return;$('ctl').querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));sel={o,b};b.classList.add('sel');fb('Ab sahi samooh chuno.');};box.appendChild(b);});
  R.groups.forEach(g=>{const d=el('button','grp');d.appendChild(el('b',null,g));smalls[g]=d;d.onclick=async()=>{if(!sel||busy)return;const {o,b}=sel;sel=null;b.classList.remove('sel');
    if(o.group===g){b.disabled=true;b.classList.add('hidden');d.appendChild(el('small',null,'✓ '+o.label));fb(o.feedback,'ok');left--;await run(o.actions);_now=take();if(!left)solved(R);}
    else{miss++;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),450);fb('Nahi, yeh '+g+' mein nahi aata. Phir socho.','bad');}};gs.appendChild(d);});
  c.appendChild(box);c.appendChild(gs);}
home();
{const h=decodeURIComponent((location.hash||'').slice(1));const k=ALL.findIndex(s=>s.qid===h);if(k>=0)open(k);}
</script></body></html>
